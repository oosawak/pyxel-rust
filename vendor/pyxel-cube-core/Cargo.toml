[package]
name = "pyxel-cube-core"
version = "3.0.0"
edition = "2021"
license = "MIT"
authors = ["Takashi Kitao <takashi.kitao@gmail.com>"]
description = "Pyxel 3.0.0 software renderer with a platform-free browser adapter"
publish = false

[lib]
name = "pyxel_cube_core"

[dependencies]
blip_buf = "0.2"
chrono = { features = ["wasmbind"], version = "0.4" }
directories = "6.0"
fontdue = "0.9"
gif = "0.14"
glow = "0.18"
gltf = { features = ["import"], version = "1" }
hound = "3.5"
image = "0.25"
indexmap = "2.7"
libc = "0.2"
noise = "0.9"
paste = "1.0"
rand = "0.10"
rand_xoshiro = "0.8"
serde = { features = ["derive"], version = "1.0" }
serde-xml-rs = "0.8"
# all-codecs enables every format the Sound.pcm() loader can accept
symphonia = { features = ["all-codecs"], version = "0.6" }
toml = "1.0"
# deflate is the only codec needed for .pyxapp / .pyxres
zip = { default-features = false, features = ["deflate"], version = "9.1" }


[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[features]
sdl2_dynamic = []
sdl2_static = []
