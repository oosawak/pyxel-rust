<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyxel-rust Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #222;
            font-family: Arial, sans-serif;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #app {
            text-align: center;
        }
        h1 {
            color: #fff;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Loading Pyxel-rust...</h1>
    </div>
    <script type="module">
        import init from './pkg/pyxel_rust.js';
        
        async function run() {
            await init();
            console.log('Pyxel-rust loaded and initialized');
        }
        
        run().catch(console.error);
    </script>
</body>
</html>
