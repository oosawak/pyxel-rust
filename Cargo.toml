[package]
name = "pyxel-rust"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of Pyxel game engine"
license = "MIT"
authors = ["Copilot"]
repository = "https://github.com/oosawak/pyxel-rust"
keywords = ["game", "graphics", "retro", "2d"]
categories = ["game-development", "graphics"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyxelCoreBackend (optional, native only)
pyxel-core = { path = "./pyxel_fork/crates/pyxel-core", optional = true }

# WgpuBackend (optional, native + WASM)
pixels  = { version = "0.12", optional = true }
winit   = { version = "0.28", optional = true }

# WasmBackend (optional, wasm32-unknown-unknown only)
wasm-bindgen          = { version = "0.2",  optional = true }
wasm-bindgen-futures  = { version = "0.4",  optional = true }
js-sys                = { version = "0.3",  optional = true }
web-sys               = { version = "0.3",  optional = true, features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
    "CanvasRenderingContext2d", "ImageData", "EventTarget",
    "KeyboardEvent", "MouseEvent", "Performance",
] }

# CLI utilities
clap    = { version = "4.5", features = ["derive"] }
anyhow  = "1.0"
thiserror = "1.0"

# Common utilities
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log        = "0.4"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3"

[features]
# Default: pyxel-core backend (SDL2 static)
default = ["pyxel-core-backend"]

# PyxelCoreBackend
pyxel-core-backend = ["dep:pyxel-core", "pyxel-core/sdl2_static"]
sdl2_static        = ["dep:pyxel-core", "pyxel-core/sdl2_static", "pyxel-core-backend"]
sdl2_dynamic       = ["dep:pyxel-core", "pyxel-core/sdl2_dynamic", "pyxel-core-backend"]

# WgpuBackend (replaces pyxel-core-backend)
wgpu-backend = ["dep:pixels", "dep:winit"]

# WasmBackend (browser canvas, wasm32-unknown-unknown)
wasm-backend = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[profile.release]
lto = true
opt-level = "z"
strip = true
