[package]
name = "pyxel-rust"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of Pyxel game engine"
license = "MIT"
authors = ["Copilot"]
repository = "https://github.com/oosawak/pyxel-rust"
keywords = ["game", "graphics", "retro", "2d"]
categories = ["game-development", "graphics"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyxelCoreBackend (optional, native only)
# Official Pyxel 3.0.0; pin the release commit for reproducible updates.
pyxel-core = { git = "https://github.com/kitao/pyxel.git", rev = "e0b528f9a6f98bfc92bb47ebe1c7623cb3f609fd", optional = true }

# Platform-free official Cube renderer used by the browser backend.
pyxel-cube-core = { path = "vendor/pyxel-cube-core", optional = true }

# WgpuBackend (optional, native + WASM)
pixels  = { version = "0.17.2", optional = true }
winit   = { version = "0.30.13", optional = true }

# WasmBackend (optional, wasm32-unknown-unknown only)
wasm-bindgen          = { version = "0.2",  optional = true }
wasm-bindgen-futures  = { version = "0.4",  optional = true }
js-sys                = { version = "0.3",  optional = true }
web-sys               = { version = "0.3",  optional = true, features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
    "CanvasRenderingContext2d", "ImageData", "EventTarget",
    "KeyboardEvent", "MouseEvent", "Performance", "WheelEvent", "DomRect",
    "AudioContext", "AudioContextOptions", "AudioContextState", "ScriptProcessorNode",
    "AudioProcessingEvent", "AudioBuffer", "AudioNode", "AudioDestinationNode",
    "CssStyleDeclaration", "Navigator", "Gamepad", "GamepadButton", "GamepadMappingType",
] }

# CLI utilities
clap    = { version = "4.5", features = ["derive"] }
anyhow  = "1.0"
thiserror = "1.0"

# Common utilities
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log        = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[features]
# Default: pyxel-core backend (SDL2 static)
default = ["sdl2_static"]

# PyxelCoreBackend
pyxel-core-backend = ["dep:pyxel-core"]
sdl2_static        = ["dep:pyxel-core", "pyxel-core/sdl2_static", "pyxel-core-backend"]
sdl2_dynamic       = ["dep:pyxel-core", "pyxel-core/sdl2_dynamic", "pyxel-core-backend"]

# WgpuBackend (replaces pyxel-core-backend)
wgpu-backend = ["dep:pixels", "dep:winit"]

# WasmBackend (browser canvas, wasm32-unknown-unknown)
wasm-backend = ["dep:pyxel-cube-core", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[profile.release]
lto = true
opt-level = "z"
# Preserve target_features so wasm-bindgen/wasm-opt detect modern WASM instructions.
strip = "debuginfo"

[[example]]
name = "retro3d"
required-features = ["pyxel-core-backend"]

[[example]]
name = "cube_audio"
required-features = ["pyxel-core-backend"]

[[example]]
name = "cube_examples"
required-features = ["pyxel-core-backend"]
