[package]
name = "pyxel-rust"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of Pyxel game engine - Pyxel-core WASM support"
license = "MIT"
authors = ["Copilot"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pyxel-core (local fork)
pyxel-core = { path = "./pyxel_fork/crates/pyxel-core", features = ["sdl2_dynamic"] }

# Common utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# WASM support (optional)
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
wasm = ["wasm-bindgen", "web-sys"]

[profile.release]
lto = true
opt-level = "z"
strip = true
