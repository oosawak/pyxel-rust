<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprite Viewer — pyxel-rust</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #eee; font: 13px/1.5 monospace;
         min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         padding: 24px 16px; gap: 20px; }
  h1  { font-size: 1.3rem; color: #7ec8e3; letter-spacing: .05em; }
  .subtitle { color: #888; font-size: .82rem; }

  #dropzone { width: 100%; max-width: 720px; border: 2px dashed #444; border-radius: 12px;
              padding: 32px 24px; text-align: center; cursor: pointer;
              transition: border-color .2s, background .2s; }
  #dropzone.over { border-color: #7ec8e3; background: #1e2a3a; }
  #dropzone p  { color: #888; }
  #dropzone small { color: #555; }

  #validation { width: 100%; max-width: 720px; display: none; }
  .vitem { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .ok  { color: #4caf50; } .err { color: #f44336; }

  #viewer { width: 100%; max-width: 960px; display: none; flex-direction: column; gap: 16px; }

  /* ---- controls ---- */
  .ctrl-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .ctrl-row label { color: #aaa; display: flex; gap: 4px; align-items: center; }
  select { background: #2a2a4a; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; }
  input[type=range]  { accent-color: #7ec8e3; width: 80px; }
  input[type=number] { background: #2a2a4a; color: #eee; border: 1px solid #444;
                       border-radius: 4px; padding: 3px 6px; width: 62px; text-align: center; }
  button { background: #2d4a6a; color: #eee; border: none; border-radius: 6px;
           padding: 5px 14px; cursor: pointer; font: inherit; }
  button:hover { background: #3a6a9a; }
  button.active { background: #1a6a4a; }
  button.warn  { background: #6a3a1a; }

  /* ---- preview ---- */
  .canvas-wrap { position: relative; display: inline-block; }
  #preview     { display: block; image-rendering: pixelated; border: 1px solid #333; border-radius: 4px; }
  #grid-overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
  #infobar { color: #7ec8e3; font-size: .80rem; min-height: 1.3em; }

  /* ---- frame strip editor ---- */
  #editor-section { border: 1px solid #334; border-radius: 8px; padding: 14px; background: #16162a; }
  #editor-section h2 { font-size: .95rem; color: #7ec8e3; margin-bottom: 10px; }
  .global-size { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .global-size label { color: #aaa; display: flex; gap: 6px; align-items: center; }

  #strip-scroll { overflow-x: auto; padding-bottom: 8px; }
  #strip { display: flex; gap: 6px; align-items: flex-start; }

  .frame-cell { display: flex; flex-direction: column; align-items: center; gap: 4px;
                background: #1e1e38; border: 1px solid #334; border-radius: 6px;
                padding: 6px 4px; min-width: 48px; }
  .frame-cell canvas { display: block; image-rendering: pixelated; border: 1px solid #2a2a4a; }
  .frame-cell .fidx  { color: #7ec8e3; font-size: .75rem; }
  .frame-cell input  { width: 56px; }
  .frame-cell .fh-inp { margin-top: 2px; }

  /* ---- sheet overview ---- */
  #sheet-wrap { overflow: auto; max-height: 400px; border: 1px solid #333; border-radius: 4px; }
  #sheet-canvas { display: block; image-rendering: pixelated; }

  details summary { cursor: pointer; color: #888; padding: 4px 0; user-select: none; }
  .sep { width: 100%; border: none; border-top: 1px solid #2a2a4a; }
</style>
</head>
<body>
<h1>🎮 Sprite Viewer — pyxel-rust</h1>
<p class="subtitle">PNG と .sprite-spec.json をドロップしてスプライトシートを確認・調整</p>
<p class="subtitle">生成コマンド: <code>pyxel-rust sprite_prompt "description" --name mychar</code></p>

<div id="dropzone">
  <p>📂 PNG と .sprite-spec.json をここにドロップ</p>
  <small>または クリックして選択（複数可）</small>
  <input type="file" id="fileinput" multiple accept=".png,.json" style="display:none">
</div>

<div id="validation"></div>

<div id="viewer">

  <!-- アニメーション再生コントロール -->
  <div class="ctrl-row">
    <label>アニメーション: <select id="anim-select"></select></label>
    <label>FPS: <input type="range" id="fps-range" min="1" max="30" value="7"><span id="fps-label">7</span></label>
    <button id="btn-play"   class="active">⏸ 停止</button>
    <button id="btn-grid">グリッド ON</button>
    <button id="btn-chroma" class="active">マゼンタ除去 ON</button>
  </div>

  <div id="infobar"></div>

  <div class="canvas-wrap">
    <canvas id="preview"></canvas>
    <canvas id="grid-overlay"></canvas>
  </div>

  <hr class="sep">

  <!-- フレームサイズ調整エディター -->
  <div id="editor-section">
    <h2>🔧 フレームサイズ調整</h2>

    <div class="global-size">
      <label>全体フレーム幅(W):
        <input type="number" id="g-fw" min="8" max="1024" value="128">
        <button id="btn-apply-gfw">全列に適用</button>
      </label>
      <label>全体フレーム高(H):
        <input type="number" id="g-fh" min="8" max="1024" value="128">
        <button id="btn-apply-gfh">全行に適用</button>
      </label>
      <button id="btn-reset-strip">リセット</button>
      <button id="btn-export-spec">📋 spec.json エクスポート</button>
    </div>

    <!-- 選択中アニメ行のフレームストリップ -->
    <div id="strip-scroll">
      <div id="strip"></div>
    </div>
  </div>

  <!-- シート全体表示 -->
  <details>
    <summary>シート全体を表示</summary>
    <div id="sheet-wrap"><canvas id="sheet-canvas"></canvas></div>
  </details>

</div><!-- #viewer -->

<script>
// ═══════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════
let spec      = null;
let rawImg    = null;
let ckImg     = null;
let animIdx   = 0;
let frame     = 0;
let fps       = 7;
let playing   = true;
let showGrid  = false;
let useChroma = true;
let rafId     = null;
let lastT     = 0;
const SCALE   = 3;
const STRIP_S = 1.5; // strip preview scale

// per-column widths and per-row heights (adjusted by user)
let colWidths = [];   // length = spec.cols
let rowHeights = [];  // length = spec.anims.length

function colOffsets() {
  const off = [0];
  for (let i = 0; i < colWidths.length - 1; i++) off.push(off[i] + colWidths[i]);
  return off;
}
function rowOffsets() {
  const off = [0];
  for (let i = 0; i < rowHeights.length - 1; i++) off.push(off[i] + rowHeights[i]);
  return off;
}

// ═══════════════════════════════════════════════════════════════════
// DOM refs
// ═══════════════════════════════════════════════════════════════════
const dropzone   = document.getElementById('dropzone');
const fileinput  = document.getElementById('fileinput');
const validDiv   = document.getElementById('validation');
const viewerDiv  = document.getElementById('viewer');
const animSel    = document.getElementById('anim-select');
const fpsRange   = document.getElementById('fps-range');
const fpsLabel   = document.getElementById('fps-label');
const btnPlay    = document.getElementById('btn-play');
const btnGrid    = document.getElementById('btn-grid');
const btnChroma  = document.getElementById('btn-chroma');
const preview    = document.getElementById('preview');
const gridOvl    = document.getElementById('grid-overlay');
const sheetCv    = document.getElementById('sheet-canvas');
const infobar    = document.getElementById('infobar');
const stripEl    = document.getElementById('strip');
const gFwInput   = document.getElementById('g-fw');
const gFhInput   = document.getElementById('g-fh');
const pCtx       = preview.getContext('2d');
const gCtx       = gridOvl.getContext('2d');
const sCtx       = sheetCv.getContext('2d');

// ═══════════════════════════════════════════════════════════════════
// Drop / File
// ═══════════════════════════════════════════════════════════════════
dropzone.addEventListener('dragover',  e => { e.preventDefault(); dropzone.classList.add('over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
dropzone.addEventListener('drop',      e => { e.preventDefault(); dropzone.classList.remove('over'); handleFiles(e.dataTransfer.files); });
dropzone.addEventListener('click',     () => fileinput.click());
fileinput.addEventListener('change',   () => handleFiles(fileinput.files));

function handleFiles(files) {
  let pngFile = null, jsonFile = null;
  for (const f of files) {
    if (f.name.endsWith('.png'))  pngFile  = f;
    if (f.name.endsWith('.json')) jsonFile = f;
  }
  const tasks = [];
  if (jsonFile) tasks.push(jsonFile.text().then(t => { spec = JSON.parse(t); }));
  if (pngFile)  tasks.push(new Promise(res => {
    const url = URL.createObjectURL(pngFile);
    rawImg = new Image();
    rawImg.onload = res;
    rawImg.src = url;
  }));
  Promise.all(tasks).then(() => {
    if (!spec) spec = defaultSpec();
    initSizes();
    validate();
    if (rawImg) { buildChroma(); buildSheetCanvas(); initViewer(); }
  });
}

function defaultSpec() {
  return {
    frame_w: 128, frame_h: 128, cols: 8, bg: '#FF00FF', facing: 'right',
    anims: ['Idle','Walk','Run','Jump','MeleeAttack','RangedAttack',
            'Damage','TurnInPlace','SpecialAttack','Singing','Resting','Victory'],
  };
}

function initSizes() {
  colWidths  = Array(spec.cols).fill(spec.frame_w);
  rowHeights = Array(spec.anims.length).fill(spec.frame_h);
  gFwInput.value = spec.frame_w;
  gFhInput.value = spec.frame_h;
}

// ═══════════════════════════════════════════════════════════════════
// Validation
// ═══════════════════════════════════════════════════════════════════
function validate() {
  const items = [];
  if (!spec) {
    items.push({ ok: false, msg: 'spec.json なし — デフォルト値を使用' });
  } else {
    items.push({ ok: true, msg: 'spec.json 読み込み OK' });
  }
  if (rawImg) {
    const ew = spec.frame_w * spec.cols;
    const eh = spec.frame_h * spec.anims.length;
    items.push({ ok: rawImg.width  === ew, msg: `幅: ${rawImg.width}px (期待値 ${ew}px)` });
    items.push({ ok: rawImg.height === eh, msg: `高さ: ${rawImg.height}px (期待値 ${eh}px)` });
    items.push({ ok: true, msg: `フレーム ${spec.frame_w}×${spec.frame_h}px  ${spec.cols}列×${spec.anims.length}行  背景: ${spec.bg}` });
  }
  validDiv.style.display = 'block';
  validDiv.innerHTML = items.map(i =>
    `<div class="vitem"><span class="${i.ok ? 'ok' : 'err'}">${i.ok ? '✓' : '✗'}</span> ${i.msg}</div>`
  ).join('');
}

// ═══════════════════════════════════════════════════════════════════
// Chromakey
// ═══════════════════════════════════════════════════════════════════
function detectBgColor(ctx, w, h) {
  const corners = [
    ctx.getImageData(0, 0, 1, 1).data,
    ctx.getImageData(w - 1, 0, 1, 1).data,
    ctx.getImageData(0, h - 1, 1, 1).data,
    ctx.getImageData(w - 1, h - 1, 1, 1).data,
  ];
  const avg = [0, 0, 0];
  for (const c of corners) { avg[0] += c[0]; avg[1] += c[1]; avg[2] += c[2]; }
  return avg.map(v => Math.round(v / 4));
}

function buildChroma() {
  const cv  = document.createElement('canvas');
  cv.width  = rawImg.width;
  cv.height = rawImg.height;
  const ctx = cv.getContext('2d');
  ctx.drawImage(rawImg, 0, 0);
  const [tr, tg, tb] = detectBgColor(ctx, cv.width, cv.height);
  const detHex = `#${[tr,tg,tb].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()}`;
  const id = ctx.getImageData(0, 0, cv.width, cv.height);
  const d  = id.data;
  const TOL = 50;
  for (let i = 0; i < d.length; i += 4) {
    if (Math.abs(d[i]-tr) < TOL && Math.abs(d[i+1]-tg) < TOL && Math.abs(d[i+2]-tb) < TOL) d[i+3] = 0;
  }
  ctx.putImageData(id, 0, 0);
  ckImg = cv;
  infobar.textContent = `背景色 検出: ${detHex}  spec: ${spec.bg || '#FF00FF'}`;
}

// ═══════════════════════════════════════════════════════════════════
// Sheet overview canvas
// ═══════════════════════════════════════════════════════════════════
function buildSheetCanvas() {
  const S = Math.min(0.5, 600 / rawImg.width);
  sheetCv.width  = Math.round(rawImg.width  * S);
  sheetCv.height = Math.round(rawImg.height * S);
  sCtx.save();
  sCtx.scale(S, S);
  sCtx.fillStyle = '#2a2a2a';
  sCtx.fillRect(0, 0, rawImg.width, rawImg.height);
  sCtx.drawImage(useChroma ? ckImg : rawImg, 0, 0);

  // column grid lines (uses colWidths)
  sCtx.strokeStyle = 'rgba(255,255,0,0.35)';
  sCtx.lineWidth = 1;
  const cOff = colOffsets();
  for (const x of [...cOff, cOff[cOff.length-1] + colWidths[colWidths.length-1]]) {
    sCtx.beginPath(); sCtx.moveTo(x, 0); sCtx.lineTo(x, rawImg.height); sCtx.stroke();
  }
  const rOff = rowOffsets();
  for (const y of [...rOff, rOff[rOff.length-1] + rowHeights[rowHeights.length-1]]) {
    sCtx.beginPath(); sCtx.moveTo(0, y); sCtx.lineTo(rawImg.width, y); sCtx.stroke();
  }
  // row labels
  sCtx.fillStyle = 'rgba(126,200,227,0.9)';
  sCtx.font = '18px monospace';
  spec.anims.forEach((name, i) => {
    sCtx.fillText(`${i}: ${name}`, 6, rOff[i] + 22);
  });
  sCtx.restore();
}

// ═══════════════════════════════════════════════════════════════════
// Frame strip editor
// ═══════════════════════════════════════════════════════════════════
function buildStrip() {
  stripEl.innerHTML = '';
  const src  = useChroma ? ckImg : rawImg;
  if (!src) return;
  const cOff = colOffsets();
  const rOff = rowOffsets();
  const sy   = rOff[animIdx];
  const fh   = rowHeights[animIdx];

  for (let c = 0; c < spec.cols; c++) {
    const fw  = colWidths[c];
    const sx  = cOff[c];
    const dw  = Math.round(fw  * STRIP_S);
    const dh  = Math.round(fh  * STRIP_S);

    const cell = document.createElement('div');
    cell.className = 'frame-cell';

    const lbl = document.createElement('div');
    lbl.className = 'fidx';
    lbl.textContent = `F${c}`;
    cell.appendChild(lbl);

    const cv  = document.createElement('canvas');
    cv.width  = dw; cv.height = dh;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = useChroma ? '#2a2a2a' : '#111';
    ctx.fillRect(0, 0, dw, dh);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(src, sx, sy, fw, fh, 0, 0, dw, dh);
    cell.appendChild(cv);

    // width input
    const wLabel = document.createElement('div');
    wLabel.style.cssText = 'color:#aaa;font-size:.72rem;margin-top:2px';
    wLabel.textContent = 'W:';
    const wInp = document.createElement('input');
    wInp.type = 'number'; wInp.min = 8; wInp.max = 1024;
    wInp.value = fw;
    wInp.addEventListener('change', () => {
      const v = Math.max(8, +wInp.value || fw);
      wInp.value = v;
      colWidths[c] = v;
      buildStrip();
      buildSheetCanvas();
    });
    cell.appendChild(wLabel);
    cell.appendChild(wInp);

    // height input (per-row)
    const hLabel = document.createElement('div');
    hLabel.style.cssText = 'color:#aaa;font-size:.72rem;';
    hLabel.textContent = 'H:';
    const hInp = document.createElement('input');
    hInp.type = 'number'; hInp.min = 8; hInp.max = 1024;
    hInp.className = 'fh-inp';
    hInp.value = fh;
    hInp.addEventListener('change', () => {
      const v = Math.max(8, +hInp.value || fh);
      hInp.value = v;
      rowHeights[animIdx] = v;
      buildStrip();
      buildSheetCanvas();
    });
    cell.appendChild(hLabel);
    cell.appendChild(hInp);

    stripEl.appendChild(cell);
  }
}

// ═══════════════════════════════════════════════════════════════════
// Viewer init
// ═══════════════════════════════════════════════════════════════════
function initViewer() {
  viewerDiv.style.display = 'flex';
  animSel.innerHTML = '';
  spec.anims.forEach((name, i) => {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = `${i}: ${name}`;
    animSel.appendChild(opt);
  });
  resizePreviewCanvas();
  frame = 0;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
  buildStrip();
}

function resizePreviewCanvas() {
  const fw = colWidths[0] || spec.frame_w;
  const fh = rowHeights[0] || spec.frame_h;
  preview.width  = fw * SCALE;
  preview.height = fh * SCALE;
  gridOvl.width  = preview.width;
  gridOvl.height = preview.height;
}

// ═══════════════════════════════════════════════════════════════════
// Animation loop
// ═══════════════════════════════════════════════════════════════════
function tick(t) {
  rafId = requestAnimationFrame(tick);
  if (playing) {
    if (t - lastT >= 1000 / fps) { frame = (frame + 1) % spec.cols; lastT = t; }
  }
  drawFrame();
}

function drawFrame() {
  if (!rawImg || !spec) return;
  const cOff = colOffsets();
  const rOff = rowOffsets();
  const fw   = colWidths[frame];
  const fh   = rowHeights[animIdx];
  const sx   = cOff[frame];
  const sy   = rOff[animIdx];
  const src  = useChroma ? ckImg : rawImg;

  // resize canvas if this frame's size differs
  if (preview.width !== fw * SCALE || preview.height !== fh * SCALE) {
    preview.width  = fw * SCALE; preview.height = fh * SCALE;
    gridOvl.width  = preview.width; gridOvl.height = preview.height;
  }

  pCtx.clearRect(0, 0, preview.width, preview.height);
  pCtx.fillStyle = useChroma ? '#2a2a2a' : '#111';
  pCtx.fillRect(0, 0, preview.width, preview.height);
  pCtx.imageSmoothingEnabled = false;
  pCtx.drawImage(src, sx, sy, fw, fh, 0, 0, fw * SCALE, fh * SCALE);

  gCtx.clearRect(0, 0, gridOvl.width, gridOvl.height);
  if (showGrid) {
    gCtx.strokeStyle = 'rgba(255,255,0,0.7)';
    gCtx.lineWidth = 1;
    gCtx.strokeRect(0.5, 0.5, gridOvl.width - 1, gridOvl.height - 1);
    gCtx.strokeStyle = 'rgba(255,80,80,0.5)';
    gCtx.beginPath();
    gCtx.moveTo(gridOvl.width / 2, 0);  gCtx.lineTo(gridOvl.width / 2, gridOvl.height);
    gCtx.moveTo(0, gridOvl.height / 2); gCtx.lineTo(gridOvl.width, gridOvl.height / 2);
    gCtx.stroke();
  }

  infobar.textContent =
    `アニメ: ${spec.anims[animIdx]}  フレーム: ${frame + 1}/${spec.cols}` +
    `  src(${sx}, ${sy})  W:${fw} H:${fh}`;
}

// ═══════════════════════════════════════════════════════════════════
// Controls
// ═══════════════════════════════════════════════════════════════════
animSel.addEventListener('change', () => {
  animIdx = +animSel.value; frame = 0;
  buildStrip();
});
fpsRange.addEventListener('input', () => { fps = +fpsRange.value; fpsLabel.textContent = fps; });
btnPlay.addEventListener('click', () => {
  playing = !playing;
  btnPlay.textContent = playing ? '⏸ 停止' : '▶ 再生';
  btnPlay.classList.toggle('active', playing);
});
btnGrid.addEventListener('click', () => {
  showGrid = !showGrid;
  btnGrid.textContent = showGrid ? 'グリッド OFF' : 'グリッド ON';
  btnGrid.classList.toggle('active', showGrid);
});
btnChroma.addEventListener('click', () => {
  useChroma = !useChroma;
  btnChroma.textContent = useChroma ? 'マゼンタ除去 ON' : 'マゼンタ除去 OFF';
  btnChroma.classList.toggle('active', useChroma);
  if (rawImg) { buildChroma(); buildSheetCanvas(); buildStrip(); }
});

// ---- global size apply ----
document.getElementById('btn-apply-gfw').addEventListener('click', () => {
  const v = Math.max(8, +gFwInput.value || spec.frame_w);
  colWidths = Array(spec.cols).fill(v);
  buildStrip(); buildSheetCanvas();
});
document.getElementById('btn-apply-gfh').addEventListener('click', () => {
  const v = Math.max(8, +gFhInput.value || spec.frame_h);
  rowHeights = Array(spec.anims.length).fill(v);
  buildStrip(); buildSheetCanvas();
});
document.getElementById('btn-reset-strip').addEventListener('click', () => {
  initSizes(); buildStrip(); buildSheetCanvas();
});

// ---- export spec ----
document.getElementById('btn-export-spec').addEventListener('click', () => {
  const avgW = Math.round(colWidths.reduce((a,b)=>a+b,0) / colWidths.length);
  const avgH = Math.round(rowHeights.reduce((a,b)=>a+b,0) / rowHeights.length);
  const out = {
    ...spec,
    frame_w: avgW,
    frame_h: avgH,
    col_widths:  colWidths,
    row_heights: rowHeights,
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'adjusted.sprite-spec.json';
  a.click();
});
</script>
</body>
</html>
