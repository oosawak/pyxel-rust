<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cubeboy</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #container {
            text-align: center;
        }
        canvas {
            border: 3px solid #fff;
            image-rendering: pixelated;
            display: block;
            margin: 20px auto;
        }
        h1 {
            margin-top: 0;
        }
        p {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>cubeboy</h1>
        <p>🎮 Game window (click below or press Ctrl+C in terminal to close)</p>
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <p>To run the game, execute:</p>
        <code>pyxel-rust app2html cubeboy</code>
    </div>
</body>
</html>
