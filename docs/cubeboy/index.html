<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubeboy - Pyxel-rust</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        
        #game-canvas {
            background: #1a1a1a;
            border: 2px solid #333;
            margin: 20px 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
            margin-left: auto;
            margin-right: auto;
            max-width: 100%;
            height: auto;
        }
        
        .info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: left;
        }
        
        .info h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .controls {
            color: #666;
            margin-top: 10px;
            font-family: monospace;
        }
        
        .controls p {
            margin: 5px 0;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 5px;
            color: #856404;
        }
        
        .loading {
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Cubeboy</h1>
        <p class="subtitle">Pyxel-rust Platform Game</p>
        
        <canvas id="game-canvas" width="512" height="512"></canvas>
        
        <div class="info">
            <h2>📖 How to Play</h2>
            <div class="controls">
                <p><strong>← → Arrow Keys:</strong> Move left/right</p>
                <p><strong>SPACE:</strong> Jump</p>
                <p><strong>X:</strong> Dash (double jump in air)</p>
                <p><strong>Q:</strong> Quit game</p>
            </div>
        </div>
        
        <div class="status">
            <p><span class="loading">⏳ Loading game...</span></p>
            <p>This is a demonstration version of Cubeboy built with pyxel-rust.</p>
        </div>
        
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
            <p style="color: #999; font-size: 0.9em;">
                <a href="https://github.com/oosawak/pyxel-rust" style="color: #667eea; text-decoration: none;">View on GitHub</a>
                | Powered by <a href="https://github.com/kitao/pyxel" style="color: #667eea; text-decoration: none;">Pyxel</a> and Rust
            </p>
        </div>
    </div>
    
    <script>
        // Game stub - actual WASM will be loaded here
        console.log('Cubeboy loaded. WASM build coming soon!');
        
        // Draw a placeholder
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#667eea';
        ctx.font = '48px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Coming Soon', canvas.width / 2, canvas.height / 2 - 50);
        
        ctx.fillStyle = '#999';
        ctx.font = '24px Arial';
        ctx.fillText('WASM Build in Progress', canvas.width / 2, canvas.height / 2 + 50);
    </script>
</body>
</html>
