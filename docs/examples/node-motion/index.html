<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nodeアニメーションの確認 — Pyxel Rust</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#101421;color:#eef0f7}body{max-width:940px;margin:auto;padding:20px}a{color:#a9c1ff}p{line-height:1.7;color:#aeb8ce}canvas{display:block;width:100%;height:auto;max-width:100%;image-rendering:pixelated;border:1px solid #495477}pre{padding:16px;background:#080c14;overflow:auto;font-size:13px}.actors{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin:20px 0}fieldset{min-width:0;border:1px solid #495477;border-radius:8px;padding:16px}legend{font-weight:bold}label{display:flex;align-items:center;gap:8px;margin:12px 0;flex-wrap:wrap}button,input,select{font:inherit;color:inherit;background:#222b40;border:1px solid #495477;border-radius:8px;padding:10px;min-height:44px;box-sizing:border-box;max-width:100%}input[type=checkbox]{min-height:0;padding:0}input[type=number]{width:100px}button{cursor:pointer;margin:4px 4px 4px 0}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #70c6a9;outline-offset:3px}output{display:block;color:#70c6a9;font-variant-numeric:tabular-nums}[role=alert]{color:#ff9798}</style>
<a href="../../">← デモ一覧</a> · <a href="../retro3d/#compatibility">全機能の対応状況</a><h1>Nodeアニメーションの確認</h1><p>同じモデルを2体並べ、別々のアニメーションを再生します。Aの操作でBの姿勢は変わりません。ゲームの更新時に、アニメーションも自動で進みます。</p><p id="status" role="status">読み込み中…</p><canvas id="pyxel_canvas" tabindex="0" aria-label="独立してアニメーションする2体のモデル"></canvas>
<div class="actors" id="actors"></div><p>1倍速は1回の更新につき1フレームです。このデモは毎秒30回更新します。「停止」は今の姿勢を保持し、「再生」は指定した開始フレームから始めます。モデル自体のデータは書き換えません。</p>
<p id="action-status" role="status"></p><button id="reset" disabled>デモを再起動</button><details><summary>状態の詳細</summary><pre id="details"></pre></details>
<script type="module">
import init,* as api from '../retro3d/pkg/pyxel_rust.js?build=0e90c90960e7';
const status=(text,error=false)=>{const el=document.querySelector('#action-status');el.textContent=text;el.setAttribute('role',error?'alert':'status');};
for(let i=0;i<2;i++){
 const panel=document.createElement('fieldset');panel.innerHTML=`<legend>モデル ${i?'B':'A'}</legend><output id="state-${i}">準備中…</output><label>アニメーション <select id="clip-${i}" disabled><option value="0">Bounce（上下移動）</option><option value="1">Turn（回転）</option></select></label><label>速度 <select id="speed-${i}" disabled><option value="-1">−1倍（逆再生）</option><option value="0">0倍（姿勢保持）</option><option value="0.5">0.5倍</option><option value="1">1倍</option><option value="2">2倍</option></select></label><label>開始・確認フレーム <input id="frame-${i}" type="number" value="0" step="1" disabled></label><label><input id="loop-${i}" type="checkbox" checked disabled>ループ再生</label><label><input id="active-${i}" type="checkbox" checked disabled>有効（外すと一時停止）</label><button id="play-${i}" disabled>再生</button><button id="stop-${i}" disabled>停止</button><button id="sample-${i}" disabled>指定フレームで停止</button>`;document.querySelector('#actors').append(panel);
 document.querySelector(`#clip-${i}`).value=String(i);document.querySelector(`#speed-${i}`).value=i?'0.5':'1';
 const value=name=>document.querySelector(`#${name}-${i}`);const action=(name,fn)=>value(name).onclick=()=>{try{fn();status(`モデル${i?'B':'A'}を操作しました`);}catch(e){status(String(e.message||e),true)}};
 action('play',()=>api.node_motion_demo_play(i,Number(value('clip').value),value('loop').checked,Number(value('speed').value),Number(value('frame').value)));
 action('stop',()=>api.node_motion_demo_stop(i));action('sample',()=>api.node_motion_demo_sample(i,Number(value('clip').value),Number(value('frame').value)));
 value('active').onchange=()=>{try{api.node_motion_demo_active(i,value('active').checked);}catch(e){status(String(e),true)}};
}
try{
 await init({module_or_path:new URL('../retro3d/pkg/pyxel_rust_bg.wasm?build=0e90c90960e7',import.meta.url)});api.start_node_motion();window.demo=api;document.querySelector('#status').textContent='実行中';document.querySelectorAll('button,input,select').forEach(el=>el.disabled=false);document.querySelector('#reset').onclick=()=>api.browser_reset();
 setInterval(()=>{const info=JSON.parse(api.node_motion_demo_info());document.querySelector('#details').textContent=JSON.stringify(info,null,2);if(info.error)status(info.error,true);for(let i=0;i<2;i++){const state=info.actors[i];document.querySelector(`#state-${i}`).textContent=state.playing?`${state.active?'再生中':'一時停止'} · ${state.clip} · ${state.frame.toFixed(1)}フレーム`:'停止中（姿勢を保持）';}},100);
}catch(e){const el=document.querySelector('#status');el.textContent=String(e);el.setAttribute('role','alert')}
</script></html>
