<h1>基本APIの動作確認</h1>
<p>楕円・三角形・輪郭・塗りつぶしと、公式のノイズ関数を描画します。画面上でマウスを動かし、クリック・ホイール・Aキーの長押し・Shiftキーを試せます。標準マッピングのゲームパッドは4台まで接続できます。</p>
<p id="status" role="status">読み込み中…</p>
<canvas id="pyxel_canvas" tabindex="0" aria-label="APIの描画と入力の確認画面"></canvas>
<p>ゲームパッドはブラウザに認識させるため、一度ボタンを押してください。下に左スティックX軸とAボタンの状態を表示します。</p>
<button id="cursor" aria-pressed="true">カーソルを隠す</button>
<pre id="input" aria-label="現在の入力状態"></pre>
<script type="module">
import init, * as api from '../retro3d/pkg/pyxel_rust.js?build=6ec861cb29d2';
try {
  await init({module_or_path:new URL('../retro3d/pkg/pyxel_rust_bg.wasm?build=6ec861cb29d2',import.meta.url)});
  api.start_api_coverage();window.demo=api;
  document.querySelector('#status').textContent='実行中';
  let cursor=true;
  document.querySelector('#cursor').onclick=()=>{cursor=!cursor;api.api_coverage_cursor(cursor);document.querySelector('#cursor').textContent=cursor?'カーソルを隠す':'カーソルを表示';document.querySelector('#cursor').setAttribute('aria-pressed',String(cursor));};
  setInterval(()=>document.querySelector('#input').textContent=JSON.stringify(JSON.parse(api.api_coverage_info()),null,2),100);
}catch(error){document.querySelector('#status').textContent=`起動できません：${error.message||error}`;document.querySelector('#status').setAttribute('role','alert');}
</script></html>
