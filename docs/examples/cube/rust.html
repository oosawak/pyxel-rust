<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cube Rust移植版</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101421;color:#eef0f7}*{box-sizing:border-box}body{margin:0;padding:12px}canvas{display:block;max-width:100%;width:100%;height:auto;margin:auto;image-rendering:pixelated;touch-action:none;outline-offset:2px}canvas:focus-visible,button:focus-visible{outline:3px solid #70c6a9}button{color:inherit;background:#222b40;border:1px solid #495477;border-radius:8px;min-height:44px;padding:8px 12px;font:inherit;touch-action:none}.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0}.hint{font-size:12px;color:#aeb8ce;line-height:1.7;text-align:center}#status{font-size:13px;text-align:center;color:#70c6a9}#status[role="alert"]{color:#ff9798}.sound{font-size:12px;color:#aeb8ce;text-align:center}button[aria-pressed="true"]{border-color:#70c6a9}#motion-controls[hidden]{display:none}
</style></head><body>
<canvas id="pyxel_canvas" tabindex="0" aria-label="Rust版の公式Cubeデモ"></canvas><p id="status" role="status">読み込み中…</p>
<div class="tools"><button data-key="left" aria-label="左">←</button><button data-key="up" aria-label="上">↑</button><button data-key="down" aria-label="下">↓</button><button data-key="right" aria-label="右">→</button><button data-key="action" id="action">アクション</button></div>
<div class="tools" id="motion-controls" hidden><button data-motion="0">1 歩く</button><button data-motion="1">2 走る</button><button data-motion="2">3 食べる</button></div>
<div class="tools"><button id="pause" aria-pressed="false">一時停止</button><button id="shade">陰影 S</button><button id="reset">リセット R</button><button id="audio" aria-pressed="false">音声をオン</button></div>
<p id="help" class="hint"></p><p class="hint">キーボードは画面をクリックしてから操作。ゲームパッドの十字キー・Aにも対応します。</p><p id="audio-status" class="sound">音声：オフ</p>
<script type="module" src="./rust.js?v=highres-1"></script></body></html>
