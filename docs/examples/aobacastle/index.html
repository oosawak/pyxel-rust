<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>青葉城 忍者登り</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a;
         display: flex; align-items: center; justify-content: center;
         width: 100vw; height: 100svh; overflow: hidden;
         touch-action: none; }
  canvas {
    display: block;
    image-rendering: pixelated;
    /* 400:640 (5:8) アスペクト比を保ちながら画面中央に最大表示 */
    width:  min(100vw, calc(100svh * 400 / 640));
    height: min(100svh, calc(100vw * 640 / 400));
  }

  /* タッチゾーンオーバーレイ */
  #touch-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-rows: 7fr 3fr;
    grid-template-columns: 1fr 1fr;
    z-index: 10;
  }
  .tz {
    pointer-events: all;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #tz-top   { grid-column: 1/3; grid-row: 1; }
  #tz-left  { grid-column: 1;   grid-row: 2; }
  #tz-right { grid-column: 2;   grid-row: 2; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="touch-overlay">
  <div class="tz" id="tz-top"></div>
  <div class="tz" id="tz-left"></div>
  <div class="tz" id="tz-right"></div>
</div>

<script type="module">
  import init, { main_aobacastle } from './pkg/pyxel_rust.js';
  async function run() {
    await init('./pkg/pyxel_rust_bg.wasm');
    main_aobacastle();
  }
  run().catch(console.error);
</script>

<script>
  function fireKey(type, code, key) {
    window.dispatchEvent(new KeyboardEvent(type, {
      code, key, bubbles: true, cancelable: true
    }));
  }

  function bindZone(id, code, key) {
    const el = document.getElementById(id);
    let active = false;
    el.addEventListener('touchstart', e => {
      e.preventDefault();
      if (!active) { active = true; fireKey('keydown', code, key); }
    }, { passive: false });
    el.addEventListener('touchend', e => {
      e.preventDefault();
      if (active) { active = false; fireKey('keyup', code, key); }
    }, { passive: false });
    el.addEventListener('touchcancel', () => {
      if (active) { active = false; fireKey('keyup', code, key); }
    });
    el.addEventListener('mousedown', () => {
      if (!active) { active = true; fireKey('keydown', code, key); }
    });
    el.addEventListener('mouseup', () => {
      if (active) { active = false; fireKey('keyup', code, key); }
    });
  }

  bindZone('tz-top',   'Space',      ' ');
  bindZone('tz-left',  'ArrowLeft',  'ArrowLeft');
  bindZone('tz-right', 'ArrowRight', 'ArrowRight');
</script>
</body>
</html>
