<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineboy - Pyxel Rust</title>
    <link rel="stylesheet" href="pyxel.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
        }
        #error-message {
            color: #ff6b6b;
            padding: 20px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <script src="pyxel.js"></script>
    <script>
        // Launch Lineboy
        launchPyxel({
            command: 'import sys; sys.path.insert(0, "."); import lineboy; lineboy.main()',
        }).catch(error => {
            document.body.innerHTML = '<div id="error-message">Error loading Lineboy:\n\n' + error.toString() + '</div>';
        });
    </script>
</body>
</html>
