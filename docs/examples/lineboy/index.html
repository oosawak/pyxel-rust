<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineboy — Pyxel-Rust WASM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: monospace;
            color: #eee;
            gap: 12px;
        }
        h1 { font-size: 1.2rem; color: #7ec8e3; }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #444;
            display: block;
        }
        .controls {
            font-size: 0.7rem;
            color: #888;
            text-align: center;
            line-height: 1.8;
        }
        .back { font-size: 0.7rem; }
        .back a { color: #7ec8e3; text-decoration: none; }
        #status { font-size: 0.75rem; color: #aaa; }
    </style>
</head>
<body>
    <h1>🏃 Lineboy</h1>
    <div id="status">Loading...</div>
    <canvas id="pyxel_canvas"></canvas>
    <div class="controls">
        Arrow / WASD: move &nbsp;|&nbsp; Z / Space / Up: jump
    </div>
    <div class="back"><a href="../../">← Back to docs</a></div>

    <script type="module">
        import init from './pkg/lineboy_rust_lib.js';
        try {
            await init();
            document.getElementById('status').textContent = '▶ Running';
        } catch (e) {
            document.getElementById('status').textContent = '❌ ' + e;
            console.error(e);
        }
    </script>
</body>
</html>
