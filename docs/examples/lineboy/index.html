<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lineboy — Pyxel-Rust</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: #111; overflow: hidden; }
        body { display: flex; flex-direction: column; align-items: center; font-family: monospace; color: #eee; }

        #header { padding: 4px 12px; font-size: 0.85rem; color: #7ec8e3; display: flex; align-items: center; gap: 12px; width: 100%; }
        #status { color: #888; font-size: 0.75rem; }
        .back a { color: #7ec8e3; text-decoration: none; font-size: 0.75rem; }

        #canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; padding: 4px; }
        canvas { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; max-height: 100%; border: 2px solid #333; display: block; }

        /* Gamepad */
        #gamepad { width: 100%; max-width: 480px; padding: 6px 12px 12px; display: flex; align-items: center; justify-content: space-between; }

        /* D-pad */
        #dpad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 2px; }
        .dp { background: #2a2a2a; border: 2px solid #444; border-radius: 8px; color: #ccc; font-size: 18px;
              display: flex; align-items: center; justify-content: center; cursor: pointer;
              -webkit-tap-highlight-color: transparent; user-select: none; }
        .dp.active { background: #555; border-color: #7ec8e3; color: #fff; }
        .dp-empty { background: #1a1a1a; border: 2px solid #1a1a1a; border-radius: 8px; }

        /* Center L/T/R */
        #center-btns { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .sm { background: #1e1e3a; border: 2px solid #444; border-radius: 10px; color: #aaa;
              font-size: 11px; font-weight: bold; width: 44px; height: 30px;
              display: flex; align-items: center; justify-content: center;
              cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
        .sm.active { background: #3e3e6a; color: #fff; border-color: #7ec8e3; }

        /* Face buttons diamond */
        #face-btns { width: 152px; height: 152px; position: relative; }
        .fb { position: absolute; width: 52px; height: 52px; border-radius: 50%;
              border: 2px solid #664488; background: #2a1a3a; color: #ddd;
              font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center;
              cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
        .fb.active { background: #5a2a7a; border-color: #cc88ff; color: #fff; }
        #fb-top  { top: 0;    left: 50%; transform: translateX(-50%); }
        #fb-left { left: 0;   top:  50%; transform: translateY(-50%); }
        #fb-rght { right: 0;  top:  50%; transform: translateY(-50%); }
        #fb-bot  { bottom: 0; left: 50%; transform: translateX(-50%); }

        @media (pointer: fine) and (min-width: 600px) { #gamepad { display: none; } }
    </style>
</head>
<body>
    <div id="header">
        <span>🎮 Lineboy</span>
        <span id="status">Loading...</span>
        <span class="back"><a href="../../">← Docs</a></span>
    </div>
    <div id="canvas-area"><canvas id="pyxel_canvas"></canvas></div>

    <div id="gamepad">
        <!-- D-pad (left/right for movement, up=jump=Space) -->
        <div id="dpad">
            <div class="dp-empty"></div>
            <button class="dp" data-idx="1">▲</button>
            <div class="dp-empty"></div>
            <button class="dp" data-idx="7">◀</button>
            <div class="dp-empty"></div>
            <button class="dp" data-idx="8">▶</button>
            <div class="dp-empty"></div>
            <button class="dp" data-idx="6">▼</button>
            <div class="dp-empty"></div>
        </div>
        <!-- center: Start -->
        <div id="center-btns">
            <button class="sm" data-idx="1" style="width:60px">START</button>
        </div>
        <!-- Face: all = Space(1) = jump/start -->
        <div id="face-btns">
            <button class="fb" id="fb-top"  data-idx="1">A</button>
            <button class="fb" id="fb-left" data-idx="1">B</button>
            <button class="fb" id="fb-rght" data-idx="1">C</button>
            <button class="fb" id="fb-bot"  data-idx="1">D</button>
        </div>
    </div>

    <script>
        const active = new Map(); // touchId -> {idx, el}

        function press(idx, down) {
            if (window.wasmModule) window.wasmModule.set_key(idx, down);
        }

        function onTouchStart(e) {
            e.preventDefault();
            for (const t of e.changedTouches) {
                const el = e.currentTarget;
                const idx = parseInt(el.dataset.idx);
                if (!active.has(t.identifier)) {
                    active.set(t.identifier, { idx, el });
                    el.classList.add('active');
                    press(idx, true);
                }
            }
        }
        function onTouchEnd(e) {
            e.preventDefault();
            for (const t of e.changedTouches) {
                const info = active.get(t.identifier);
                if (info) {
                    info.el.classList.remove('active');
                    press(info.idx, false);
                    active.delete(t.identifier);
                }
            }
        }
        document.querySelectorAll('[data-idx]').forEach(btn => {
            btn.addEventListener('touchstart',  onTouchStart, { passive: false });
            btn.addEventListener('touchend',    onTouchEnd,   { passive: false });
            btn.addEventListener('touchcancel', onTouchEnd,   { passive: false });
        });

        // ── Audio System ───────────────────────────────────────────────────
        let audioCtx = null;
        let bgmAudio = null;
        let bgmStarted = false;

        const BGM_FILES = [
            'BGM/ComfyUI_00001_.mp3',
            'BGM/ComfyUI_00002_.mp3',
            'BGM/ComfyUI_00003_.mp3',
            'BGM/ComfyUI_00004_.mp3',
        ];
        let bgmIdx = 0;

        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function startBgm() {
            if (bgmStarted) return;
            bgmStarted = true;
            bgmIdx = Math.floor(Math.random() * BGM_FILES.length);
            playNextBgm();
        }

        function playNextBgm() {
            if (bgmAudio) { bgmAudio.pause(); bgmAudio.src = ''; }
            bgmAudio = new Audio(BGM_FILES[bgmIdx % BGM_FILES.length]);
            bgmAudio.volume = 0.35;
            bgmAudio.onended = () => { bgmIdx++; playNextBgm(); };
            bgmAudio.play().catch(() => {});
            bgmIdx++;
        }

        // SFX tones for lineboy
        // sound 0 = jump, 1 = land, 2 = hit/death, 3 = item collect
        function playSfxTone(freq, type, duration, fadeOut) {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            if (fadeOut) osc.frequency.exponentialRampToValueAtTime(freq * 0.4, ctx.currentTime + duration);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + duration);
        }

        window.pyxelPlaySound = function(ch, sound) {
            startBgm();
            try {
                if (sound === 0) playSfxTone(380, 'square', 0.1, true);    // jump
                if (sound === 1) playSfxTone(150, 'sawtooth', 0.15, true); // land/hit
                if (sound === 2) playSfxTone(180, 'sawtooth', 0.3, true);  // death
                if (sound === 3) playSfxTone(600, 'triangle', 0.18, false);// item
            } catch(e) {}
        };
        window.pyxelStopSound = function(ch) {};

        document.addEventListener('keydown',    startBgm, { once: true });
        document.addEventListener('touchstart', startBgm, { once: true });
        document.addEventListener('mousedown',  startBgm, { once: true });
    </script>
    <script type="module">
        import init, { set_key } from './pkg/lineboy_rust_lib.js';
        try {
            const wasm = await init();
            window.wasmModule = { set_key };
            document.getElementById('status').textContent = '▶ Running';
        } catch(e) {
            document.getElementById('status').textContent = '❌ ' + e;
            console.error(e);
        }
    </script>
</body>
</html>
