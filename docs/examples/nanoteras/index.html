<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NanoTerras — 光の環</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: monospace;
            color: #a9c1ff;
        }

        #nt-header {
            width: 100%;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0a0a1a;
            border-bottom: 1px solid #1a2a4a;
            flex-shrink: 0;
        }
        #nt-title { font-size: 0.9rem; color: #a9c1ff; letter-spacing: 0.08em; }
        #nt-subtitle { font-size: 0.65rem; color: #395c98; }
        #nt-status { font-size: 0.7rem; color: #19959c; }
        .nt-back a {
            color: #395c98;
            text-decoration: none;
            font-size: 0.75rem;
        }
        .nt-back a:hover { color: #a9c1ff; }

        #nt-canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 0;
            padding: 4px;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%;
            max-height: 100%;
            display: block;
            border: 1px solid #1a2a4a;
            box-shadow: 0 0 32px #19959c44;
        }

        #nt-hint {
            width: 100%;
            text-align: center;
            font-size: 0.65rem;
            color: #395c98;
            padding: 4px;
            flex-shrink: 0;
            background: #0a0a1a;
        }
    </style>
</head>
<body>
    <div id="nt-header">
        <div>
            <div id="nt-title">🔬 NanoTerras</div>
            <div id="nt-subtitle">東北放射光施設 — 光の環</div>
        </div>
        <span id="nt-status">Loading...</span>
        <span class="nt-back"><a href="../../">← Docs</a></span>
    </div>

    <div id="nt-canvas-area">
        <canvas id="pyxel_canvas"></canvas>
    </div>

    <div id="nt-hint">タップ / クリックで光のバーストを発生させよう</div>

    <script type="module">
        import init, { main_nanoteras } from './pkg/pyxel_rust.js';
        try {
            await init();
            document.getElementById('nt-status').textContent = '▶ Running';
            main_nanoteras();
        } catch (e) {
            document.getElementById('nt-status').textContent = '❌ ' + e;
            console.error(e);
        }
    </script>
</body>
</html>
