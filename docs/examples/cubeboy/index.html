<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubeboy - Pyxel Rust</title>
    <link rel="stylesheet" href="pyxel.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
        }
        #error-container {
            color: #ff6b6b;
            padding: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            max-width: 800px;
        }
        #debug-info {
            color: #6bff6b;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="error-container"></div>
    <div id="debug-info"></div>
    
    <script src="pyxel.js"></script>
    <script>
        const errorDiv = document.getElementById('error-container');
        const debugDiv = document.getElementById('debug-info');
        
        // Log all resource loads
        window.addEventListener('error', (event) => {
            debugDiv.innerHTML += `Error: ${event.message} at ${event.filename}:${event.lineno}\n`;
        });
        
        // Check if files are accessible
        async function checkResources() {
            const files = ['pyxel.js', 'pyxel.css', 'pyxel-2.7.9-cp38-abi3-emscripten_4_0_9_wasm32.whl'];
            debugDiv.innerHTML += 'Checking resources:\n';
            for (const file of files) {
                try {
                    const response = await fetch(file, { method: 'HEAD' });
                    debugDiv.innerHTML += `✓ ${file}: ${response.status}\n`;
                } catch (e) {
                    debugDiv.innerHTML += `✗ ${file}: ${e.message}\n`;
                }
            }
        }
        
        checkResources();
        
        // Launch Cubeboy
        if (typeof launchPyxel !== 'undefined') {
            launchPyxel({
                command: 'print("Cubeboy loaded!")',
            }).catch(error => {
                console.error('Failed to load Pyxel:', error);
                errorDiv.innerHTML = 'Error loading Cubeboy:\n\n' + error.toString() + '\n\nStack:\n' + error.stack;
            });
        } else {
            errorDiv.innerHTML = 'Error: launchPyxel function not found. pyxel.js may not have loaded correctly.';
        }
    </script>
</body>
</html>
