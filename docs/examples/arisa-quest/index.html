<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>アリサクエスト — Pyxel-Rust</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: #0a0a1a; overflow: hidden; }
        body { display: flex; flex-direction: column; align-items: center; font-family: monospace; color: #eee; }

        #header { padding: 4px 12px; font-size: 0.85rem; color: #ff88cc; display: flex; align-items: center; gap: 12px; width: 100%; }
        #status { color: #888; font-size: 0.75rem; }
        .back a { color: #7ec8e3; text-decoration: none; font-size: 0.75rem; }

        /* Canvas area — flex center with stacked canvases */
        #canvas-area {
            flex: 1; display: flex; align-items: center; justify-content: center;
            width: 100%; min-height: 0; padding: 4px;
        }
        /* Wrapper sizes to pyxel_canvas; bg-canvas overlays behind it */
        #game-wrapper {
            position: relative;
            line-height: 0;
            border: 2px solid #2a1a3a;
        }
        #pyxel_canvas {
            image-rendering: pixelated; image-rendering: crisp-edges;
            max-width: calc(100vw - 12px);
            max-height: calc(100dvh - 130px);
            display: block;
            mix-blend-mode: screen;
            position: relative;
            z-index: 1;
        }
        #bg-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            image-rendering: auto;
            pointer-events: none;
        }

        /* Gamepad */
        #gamepad { width: 100%; max-width: 480px; padding: 6px 12px 12px; display: flex; align-items: center; justify-content: space-between; }

        /* D-pad */
        #dpad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 2px; }
        .dp { background: #1a1a2a; border: 2px solid #444; border-radius: 8px; color: #ccc; font-size: 18px;
              display: flex; align-items: center; justify-content: center; cursor: pointer;
              -webkit-tap-highlight-color: transparent; user-select: none; }
        .dp.active { background: #3a2a5a; border-color: #ff88cc; color: #fff; }
        .dp-empty { background: #0a0a1a; border: 2px solid #0a0a1a; border-radius: 8px; }

        /* Center buttons */
        #center-btns { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .sm { background: #1e1e3a; border: 2px solid #444; border-radius: 10px; color: #aaa;
              font-size: 11px; font-weight: bold; width: 44px; height: 30px;
              display: flex; align-items: center; justify-content: center;
              cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
        .sm.active { background: #3e3e6a; color: #fff; border-color: #ff88cc; }

        /* Face buttons */
        #face-btns { width: 152px; height: 152px; position: relative; }
        .fb { position: absolute; width: 52px; height: 52px; border-radius: 50%;
              border: 2px solid #664488; background: #2a1a3a; color: #ddd;
              font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center;
              cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
        .fb.active { background: #5a2a7a; border-color: #ff88cc; color: #fff; }
        #fb-top  { top: 0;    left: 50%; transform: translateX(-50%); }
        #fb-left { left: 0;   top:  50%; transform: translateY(-50%); }
        #fb-rght { right: 0;  top:  50%; transform: translateY(-50%); }
        #fb-bot  { bottom: 0; left: 50%; transform: translateX(-50%); }

        @media (pointer: fine) and (min-width: 600px) { #gamepad { display: none; } }
    </style>
</head>
<body>
    <div id="header">
        <span>🐱 アリサクエスト</span>
        <span id="status">Loading...</span>
        <span class="back"><a href="../../">← Docs</a></span>
    </div>

    <!-- game-wrapper: bg-canvas (art layer) + pyxel_canvas (UI layer, mix-blend-mode: screen) -->
    <div id="canvas-area">
        <div id="game-wrapper">
            <canvas id="bg-canvas"></canvas>
            <canvas id="pyxel_canvas"></canvas>
        </div>
    </div>

    <div id="gamepad">
        <!-- D-pad -->
        <div id="dpad">
            <div class="dp-empty"></div>
            <button class="dp" data-idx="5">▲</button>
            <div class="dp-empty"></div>
            <button class="dp" data-idx="7">◀</button>
            <div class="dp-empty"></div>
            <button class="dp" data-idx="8">▶</button>
            <div class="dp-empty"></div>
            <button class="dp" data-idx="6">▼</button>
            <div class="dp-empty"></div>
        </div>
        <!-- START -->
        <div id="center-btns">
            <button class="sm" data-idx="2">START</button>
        </div>
        <!-- Face: A=Z(45) B=X(43) -->
        <div id="face-btns">
            <button class="fb" id="fb-top"  data-idx="45">決定</button>
            <button class="fb" id="fb-left" data-idx="43">B</button>
            <button class="fb" id="fb-rght" data-idx="1">C</button>
            <button class="fb" id="fb-bot"  data-idx="2">スタート</button>
        </div>
    </div>

    <script>
        const active = new Map();

        function press(idx, down) {
            if (window.wasmModule) window.wasmModule.set_key(idx, down);
        }

        function onTouchStart(e) {
            e.preventDefault();
            for (const t of e.changedTouches) {
                const el = e.currentTarget;
                const idx = parseInt(el.dataset.idx);
                if (!active.has(t.identifier)) {
                    active.set(t.identifier, { idx, el });
                    el.classList.add('active');
                    press(idx, true);
                }
            }
        }
        function onTouchEnd(e) {
            e.preventDefault();
            for (const t of e.changedTouches) {
                const info = active.get(t.identifier);
                if (info) {
                    info.el.classList.remove('active');
                    press(info.idx, false);
                    active.delete(t.identifier);
                }
            }
        }
        document.querySelectorAll('[data-idx]').forEach(btn => {
            btn.addEventListener('touchstart',  onTouchStart, { passive: false });
            btn.addEventListener('touchend',    onTouchEnd,   { passive: false });
            btn.addEventListener('touchcancel', onTouchEnd,   { passive: false });
        });

        window.pyxelPlaySound = function(ch, sound) {};
        window.pyxelStopSound = function(ch) {};
    </script>

    <!-- ── Background canvas art layer ──────────────────────────────────────── -->
    <script>
        const ASSET_BASE = '../../assets/design/';

        // Sprite sheet grid constants
        // enemy-sprites.png: 6 cols × 4 rows, 256×256 per cell
        //   col 0 = labels (skip), col 1 = large ref sprite (top 128px = enemy A, bottom 128px = enemy B)
        const BG_COLS = 6, BG_CW = 256, BG_CH = 256;  // world-backgrounds-2: 6×4 grid, 256×256 per cell (24 total)

        // Map game enemy index → sprite source { sheet, sx, sy, sw, sh }
        // Using col=1 (x=256) of enemy-sprites.png, each row has 2 enemies stacked (128px each)
        const ENEMY_MAP = [
            { sheet: 'enemy-sprites', sx: 256, sy: 256, sw: 256, sh: 128 },  // 0: スライム      (row1 top)
            { sheet: 'enemy-sprites', sx: 256, sy:   0, sw: 256, sh: 128 },  // 1: シャドウキャット (row0 top)
            { sheet: 'enemy-sprites', sx: 256, sy: 384, sw: 256, sh: 128 },  // 2: フレイムインプ  (row1 bot)
            { sheet: 'enemy-sprites', sx: 256, sy: 768, sw: 256, sh: 128 },  // 3: ゴースト       (row3 top)
            { sheet: 'enemy-sprites', sx: 256, sy: 896, sw: 256, sh: 128 },  // 4: ロックゴーレム  (row3 bot)
        ];

        // Preload sprite sheets + title art
        const SHEETS = {};
        const SHEET_LIST = [
            'enemy-sprites', 'enemy-sprites-2', 'enemy-sprites-3',
            'enemy-sprites-4', 'enemy-sprites-5',
            'arisa-player-sprites', 'arisa-world-backgrounds-2',
            'arisa-3d-art',
        ];
        let loadedCount = 0;
        for (const name of SHEET_LIST) {
            const img = new Image();
            img.onload = () => loadedCount++;
            img.onerror = () => console.warn('Failed to load:', name);
            img.src = ASSET_BASE + name + '.png';
            SHEETS[name] = img;
        }

        // Display regions in 160×120 game pixels
        const SCENE_H = 84;  // y=0..83 = battle scene; y=84..119 = UI
        // Arisa: LEFT side
        const ARISA_DEST = { x: 8, y: 8, w: 58, h: 76 };
        // Enemy: RIGHT side, slightly higher
        const ENE_DEST   = { x: 95, y: 4, w: 58, h: 72 };

        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx    = bgCanvas.getContext('2d');

        // Resize bg-canvas pixel buffer to match actual display size.
        // Drawing code stays in 160×120 coordinate space via ctx.scale().
        function resizeBgCanvas() {
            const pyxel = document.getElementById('pyxel_canvas');
            const w = pyxel.offsetWidth;
            const h = pyxel.offsetHeight;
            if (w > 0 && h > 0 && (bgCanvas.width !== w || bgCanvas.height !== h)) {
                bgCanvas.width  = w;
                bgCanvas.height = h;
            }
        }
        window.addEventListener('resize', resizeBgCanvas);

        // Apply scale so all drawing uses 160×120 logical pixels
        function beginScaledDraw() {
            resizeBgCanvas();
            bgCtx.save();
            bgCtx.imageSmoothingEnabled = true;
            bgCtx.imageSmoothingQuality = 'high';
            bgCtx.scale(bgCanvas.width / 160, bgCanvas.height / 120);
        }

        function renderTitle() {
            beginScaledDraw();
            bgCtx.clearRect(0, 0, 160, 120);
            const grad = bgCtx.createLinearGradient(0, 0, 0, 120);
            grad.addColorStop(0, '#0a0520');
            grad.addColorStop(1, '#1a0535');
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0, 0, 160, 120);

            const arisa3d = SHEETS['arisa-3d-art'];
            if (arisa3d && arisa3d.complete && arisa3d.naturalWidth > 0) {
                const srcW = arisa3d.naturalWidth;
                const srcH = arisa3d.naturalHeight;
                const cropX = srcW * 0.15;
                const cropW = srcW * 0.70;
                const dstH = 105;
                const dstW = dstH * cropW / srcH;
                const dstX = 160 - dstW - 4;
                bgCtx.drawImage(arisa3d, cropX, 0, cropW, srcH, dstX, 8, dstW, dstH);
            }
            bgCtx.restore();
        }

        function renderBg() {
            if (!window.wasmModule) return;

            const state = window.wasmModule.get_game_state?.() ?? 0;

            if (state === 0) {
                renderTitle();
                return;
            }

            if (state !== 2) {
                bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                return;
            }

            if (loadedCount < SHEET_LIST.length) return;

            const enemyIdx    = window.wasmModule.get_enemy_idx?.()    ?? -1;
            const bgIdx       = window.wasmModule.get_bg_idx?.()       ??  0;
            const enemyFlash  = window.wasmModule.get_enemy_flash?.()  ??  0;
            const playerFlash = window.wasmModule.get_player_flash?.() ??  0;

            beginScaledDraw();
            bgCtx.clearRect(0, 0, 160, 120);

            // ── Battle background ─────────────────────────────────────────────
            const bgI  = ((bgIdx % 24) + 24) % 24;
            const bgSx = (bgI % BG_COLS) * BG_CW;
            const bgSy = Math.floor(bgI / BG_COLS) * BG_CH;
            bgCtx.drawImage(
                SHEETS['arisa-world-backgrounds-2'],
                bgSx, bgSy, BG_CW, BG_CH,
                0, 0, 160, SCENE_H
            );

            // ── Arisa sprite (LEFT) ───────────────────────────────────────────
            const showArisa = playerFlash <= 0 || Math.floor(playerFlash / 4) % 2 === 0;
            if (showArisa) {
                bgCtx.drawImage(
                    SHEETS['arisa-player-sprites'],
                    0, 0, 128, 256,
                    ARISA_DEST.x, ARISA_DEST.y, ARISA_DEST.w, ARISA_DEST.h
                );
            }

            // ── Enemy sprite (RIGHT, slightly higher) ─────────────────────────
            if (enemyIdx >= 0 && enemyIdx < ENEMY_MAP.length) {
                const e = ENEMY_MAP[enemyIdx];
                const showEnemy = enemyFlash <= 0 || Math.floor(enemyFlash / 4) % 2 === 0;
                if (showEnemy) {
                    bgCtx.drawImage(
                        SHEETS[e.sheet],
                        e.sx, e.sy, e.sw, e.sh,
                        ENE_DEST.x, ENE_DEST.y, ENE_DEST.w, ENE_DEST.h
                    );
                }
            }

            bgCtx.globalAlpha = 1.0;
            bgCtx.restore();
        }

        function bgLoop() {
            renderBg();
            requestAnimationFrame(bgLoop);
        }
        requestAnimationFrame(bgLoop);
    </script>

    <script type="module">
        import init, {
            set_key,
            get_game_state, get_enemy_idx, get_bg_idx,
            get_enemy_flash, get_player_flash,
        } from './pkg/rpg_rust_lib.js';
        try {
            const wasm = await init();
            window.wasmModule = {
                set_key,
                get_game_state, get_enemy_idx, get_bg_idx,
                get_enemy_flash, get_player_flash,
            };
            document.getElementById('status').textContent = '▶ 実行中';
            // pyxel_canvas now has its size set by WASM — resize bg-canvas to match
            requestAnimationFrame(() => resizeBgCanvas());
        } catch(e) {
            document.getElementById('status').textContent = '❌ ' + e;
            console.error(e);
        }
    </script>
</body>
</html>
