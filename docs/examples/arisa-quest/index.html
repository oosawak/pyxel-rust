<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>アリサクエスト — Pyxel-Rust</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'DotGothic16', monospace; color: #eee; }
        body { display: flex; flex-direction: column; }

        /* ── Status bar (always visible) ────────────────────────── */
        #status-bar {
            flex-shrink: 0;
            background: linear-gradient(90deg, #0d0525, #1a0535);
            border-bottom: 2px solid #3a1060;
            padding: 6px 12px;
            display: flex; align-items: center; gap: 10px;
        }
        #status-bar .portrait-wrap {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid #ff88cc; overflow: hidden;
            flex-shrink: 0; position: relative;
            box-shadow: 0 0 8px rgba(255,136,204,0.5);
        }
        #status-bar .portrait-wrap img {
            position: absolute;
            width: 57px; height: auto;
            left: 50%; top: 0px;
            transform: translateX(-50%);
        }
        #status-bar .stats { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .stat-row { display: flex; align-items: center; gap: 5px; }
        .stat-lbl { font-size: 0.6rem; color: #ff88cc; width: 18px; text-align: right; flex-shrink: 0; }
        .bar-bg { flex: 1; height: 7px; background: #1a0535; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .bar-hp  { background: linear-gradient(90deg, #cc2244, #ff6688); }
        .bar-mp  { background: linear-gradient(90deg, #2244cc, #6688ff); }
        .stat-val { font-size: 0.58rem; color: #aaa; min-width: 38px; }
        .lv-badge { background: #2a0860; border: 1px solid #8844cc; border-radius: 4px;
                    padding: 2px 7px; font-size: 0.65rem; color: #cc88ff; flex-shrink: 0; }
        .back-link { font-size: 0.7rem; flex-shrink: 0; }
        .back-link a { color: #7ec8e3; text-decoration: none; }

        /* ── Main area ────────────────────────────────────────────── */
        :root { --tab-h: 52px; }
        #main { flex: 1; position: relative; overflow: hidden; min-height: 0; }

        /* ── Map layer ───────────────────────────────────────────── */
        #map-layer { position: absolute; inset: 0; bottom: var(--tab-h); z-index: 1; }
        /* Dark overlay with multiply blend — darkens map while keeping contrast */
        #map-dark-overlay {
            position: absolute; inset: 0; z-index: 2;
            background: rgba(20, 10, 60, 0.50);
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        /* ── 電子空間オーバーレイ（GPS確定前） ────────────────────── */
        #cyber-overlay {
            position: absolute; inset: 0; z-index: 600;
            background: #000814;
            display: none; align-items: center; justify-content: center;
            overflow: hidden;
            opacity: 1; transition: opacity 1.4s ease;
        }
        #cyber-overlay.active { display: flex; }
        #cyber-overlay.fade-out { opacity: 0; }
        #cyber-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        #cyber-status {
            position: relative; z-index: 1;
            text-align: center; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        #cyber-icon {
            font-size: 2.8rem; animation: cyberPulse 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 12px #00ffcc);
        }
        #cyber-text {
            font-family: 'DotGothic16', monospace; font-size: 1rem;
            color: #00ffcc; letter-spacing: 0.12em;
            text-shadow: 0 0 10px #00ffcc;
        }
        #cyber-sub {
            font-family: monospace; font-size: 0.65rem;
            color: rgba(0,255,200,0.55); letter-spacing: 0.2em;
        }
        @keyframes cyberPulse {
            0%,100% { transform: scale(1);   opacity: 1;    }
            50%      { transform: scale(1.15); opacity: 0.7; }
        }

        /* ── Location overlay ────────────────────────────────────── */
        #loc-overlay {
            position: absolute; inset: 0; z-index: 1000;
            background: rgba(10,5,30,0.92);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; padding: 24px; padding-bottom: 30px; text-align: center;
        }
        #loc-overlay h2 { font-size: 1.1rem; color: #ff88cc; }
        #loc-overlay p  { font-size: 0.8rem; color: #aaa; line-height: 1.6; }
        #btn-gps {
            background: linear-gradient(135deg, #3a1060, #1a0535);
            border: 1px solid #aa66ff; border-radius: 8px;
            color: #fff; font-family: inherit; font-size: 0.95rem;
            padding: 11px 24px; cursor: pointer;
        }

        /* ── 現在地ボタン (右上) ─────────────────────────────────── */
        #btn-recenter {
            display: none;
            position: absolute; top: 10px; right: 10px; z-index: 500;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(20,10,50,0.92); border: 2px solid #aa66ff;
            color: #cc99ff; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            align-items: center; justify-content: center;
            padding: 0;
        }

        /* ── Battle overlay (hidden until battle) ────────────────── */
        #battle-overlay {
            position: absolute;
            top: 56px; left: 0; right: 0;
            bottom: calc(var(--tab-h) + 56px);
            z-index: 10;
            display: none; flex-direction: column;
            background: rgba(0, 0, 18, 0.62);
            border-radius: 12px;
        }
        #battle-overlay.active { display: flex; }
        #debug-overlay {
            display: none;
            position: absolute; top: 4px; right: 4px; z-index: 99;
            background: rgba(0,0,0,0.82); border: 1px solid #555;
            border-radius: 6px; padding: 6px 10px;
            font-size: 0.6rem; color: #0f0; line-height: 1.7;
            font-family: monospace; pointer-events: none;
            white-space: pre;
        }
        #debug-overlay.visible { display: block; }
        #btn-debug {
            position: absolute; top: 4px; left: 4px; z-index: 100;
            background: rgba(0,0,0,0.7); border: 1px solid #555;
            border-radius: 4px; color: #888; font-size: 0.55rem;
            font-family: monospace; padding: 3px 6px; cursor: pointer;
        }
        #btn-debug.on { color: #0f0; border-color: #0f0; }

        /* HUDトグルボタン */
        #btn-hud {
            position: absolute; top: 4px; left: 40px; z-index: 100;
            background: rgba(0,0,0,0.7); border: 1px solid #555;
            border-radius: 4px; color: #888; font-size: 0.55rem;
            font-family: monospace; padding: 3px 6px; cursor: pointer;
        }
        #btn-hud.on { color: #ffcc66; border-color: #ffcc66; }

        /* バトルHUD情報オーバーレイ */
        #battle-hud {
            display: none;
            position: absolute; top: 0; left: 0; right: 0; z-index: 90;
            pointer-events: none;
            padding: 6px 10px 8px;
            background: linear-gradient(to bottom, rgba(0,0,10,0.7) 0%, transparent 100%);
        }
        #battle-hud.active { display: block; }
        .hud-row {
            display: flex; align-items: center; gap: 12px;
            font-family: 'DotGothic16', monospace; font-size: 0.7rem;
        }
        .hud-item {
            display: flex; align-items: center; gap: 5px;
            background: rgba(0,0,0,0.45); border-radius: 6px;
            padding: 3px 8px; color: #eeddff;
        }
        .hud-item .hud-label { color: #aa88cc; font-size: 0.6rem; }
        .hud-item .hud-val   { color: #ffffff; font-weight: bold; }
        .hud-item .hud-val.near  { color: #ff6644; }
        .hud-item .hud-val.mid   { color: #ffcc44; }
        .hud-item .hud-val.far   { color: #88ddff; }
        /* Canvas area */
        #canvas-area {
            flex: 1; min-height: 0;
            position: relative;
        }
        #canvas-scene {
            width: 100%; height: 100%;
        }
        #game-wrapper { position: relative; width: 100%; height: 100%; }
        #pyxel_canvas {
            position: absolute; top: -9999px; left: -9999px;
            width: 320px; height: 240px; visibility: hidden;
        }
        #bg-canvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            image-rendering: auto; pointer-events: none; z-index: 0;
        }

        /* ── Arisa Quest バトルUI ─────────────────────────────────── */
        #battle-ui {
            display: none; flex-direction: column; flex-shrink: 0;
            background: #08041a; border-top: 2px solid #2a1045;
            width: 100%; max-width: 480px; margin: 0 auto;
        }
        #battle-ui.active { display: flex; }
        #battle-commands {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            padding: 10px 14px 6px;
        }
        .battle-cmd {
            background: linear-gradient(160deg, #15082e, #22104a);
            border: 2px solid #5533aa; border-radius: 10px;
            color: #e8d8ff; font-family: 'DotGothic16', monospace;
            font-size: 1rem; padding: 13px 0; cursor: pointer;
            text-align: center; transition: all 0.1s;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        .battle-cmd:active { transform: scale(0.95); }
        #cmd-attack { border-color: #ff6644; color: #ffccbb; }
        #cmd-attack:active { background: #3a1500; border-color: #ff8866; }
        #cmd-skill  { border-color: #4488ff; color: #bbddff; }
        #cmd-skill:active  { background: #001535; border-color: #66aaff; }
        #cmd-item   { border-color: #44cc88; color: #bbffdd; }
        #cmd-item:active   { background: #001a0e; border-color: #66ddaa; }
        #cmd-run    { border-color: #888899; color: #ccccdd; }
        #cmd-run:active    { background: #111122; border-color: #aaaacc; }

        /* ── バトル結果画面 ─────────────────────────────────────── */
        #battle-result {
            display: none;
            position: absolute; inset: 0; z-index: 50;
            background: rgba(0, 0, 18, 0.45);
            backdrop-filter: blur(2px);
            flex-direction: column; align-items: center; justify-content: center;
            gap: 18px;
        }
        #battle-result.active { display: flex; }
        #battle-result-title {
            font-family: 'DotGothic16', monospace;
            font-size: 2rem; letter-spacing: 4px;
            text-shadow: 0 0 18px currentColor;
        }
        #battle-result-title.win  { color: #ffee44; }
        #battle-result-title.lose { color: #ff4466; }
        #battle-result-title.fled { color: #99aacc; }
        #battle-result-msg {
            font-family: 'DotGothic16', monospace;
            font-size: 0.85rem; color: #aa99cc; text-align: center;
            line-height: 1.8;
        }
        #btn-back-to-map {
            margin-top: 8px;
            padding: 14px 36px;
            background: linear-gradient(135deg, #2a1045, #3d1868);
            border: 2px solid #aa66ff; border-radius: 14px;
            color: #eeddff; font-family: 'DotGothic16', monospace;
            font-size: 1rem; cursor: pointer;
            box-shadow: 0 0 12px rgba(170,102,255,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        #btn-back-to-map:active { transform: scale(0.96); }

        /* ── タブバー ─────────────────────────────────────────────── */
        #tab-bar {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 30;
            display: flex; border-top: 2px solid #1a0830;
            background: #08041a;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .tab-btn {
            flex: 1; padding: 9px 0 8px; background: #08041a; border: none;
            border-top: 3px solid transparent; color: #554466;
            font-family: 'DotGothic16', monospace; font-size: 0.7rem;
            cursor: pointer; transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active { color: #ff88cc; border-top-color: #ff88cc; background: #110828; }
        .tab-btn:not(.active):active { color: #aa66cc; }

        /* ── Leaflet marker styles ───────────────────────────────── */
        /* 自分（GPS）マーカー */
        .player-dot {
            width: 18px; height: 18px; border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #88ccff, #2266ff);
            border: 2px solid #fff;
            box-shadow: 0 0 8px rgba(100,180,255,0.9), 0 0 20px rgba(100,180,255,0.4);
            animation: player-pulse 1.8s ease-in-out infinite;
        }
        @keyframes player-pulse {
            0%,100% { box-shadow: 0 0 8px rgba(100,180,255,0.9), 0 0 20px rgba(100,180,255,0.4); }
            50%      { box-shadow: 0 0 14px rgba(100,180,255,1),   0 0 32px rgba(100,180,255,0.6); }
        }

        /* アリサマーカー */
        .arisa-marker { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .arisa-icon {
            width: 56px; height: 70px; object-fit: cover; object-position: 50% 8%;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            border: 3px solid #ff88cc;
            box-shadow: 0 0 14px rgba(255,136,204,0.9), 0 0 28px rgba(255,136,204,0.5);
        }
        .arisa-marker.searchable .arisa-icon {
            animation: arisa-tap-pulse 1.4s ease-in-out infinite;
        }
        @keyframes arisa-tap-pulse {
            0%,100% { box-shadow: 0 0 14px rgba(255,136,204,0.9), 0 0 28px rgba(255,136,204,0.5); }
            50%      { box-shadow: 0 0 28px rgba(255,136,204,1), 0 0 54px rgba(255,136,204,0.9); }
        }
        .arisa-lbl {
            background: rgba(180,40,120,0.85); border: 1px solid #ff88cc;
            border-radius: 4px; padding: 2px 7px;
            font-family: 'DotGothic16', monospace; font-size: 0.6rem; color: #fff;
            white-space: nowrap; margin-top: 3px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.7);
        }
        .arisa-lbl.tap-hint {
            background: #d0006f; border-color: #ff44aa;
            color: #fff; font-size: 0.65rem; font-weight: bold;
            padding: 3px 9px; border-radius: 12px;
            box-shadow: 0 0 10px rgba(255,68,170,0.9), 0 2px 6px rgba(0,0,0,0.8);
            animation: blink-hint 1.2s ease-in-out infinite;
        }
        @keyframes blink-hint {
            0%,100%{ opacity:1; box-shadow:0 0 10px rgba(255,68,170,0.9), 0 2px 6px rgba(0,0,0,0.8); }
            50%    { opacity:0.75; box-shadow:0 0 20px rgba(255,68,170,1), 0 2px 6px rgba(0,0,0,0.8); }
        }
        .enemy-marker { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .enemy-sprite { image-rendering: pixelated; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.9)); }
        .enemy-lbl {
            background: rgba(10,5,30,0.88); border: 1px solid #6633aa;
            border-radius: 3px; padding: 1px 4px;
            font-family: 'DotGothic16', monospace; font-size: 0.52rem; color: #ff88cc;
            white-space: nowrap; margin-top: 1px;
        }
        .enemy-pulse { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse {
            0%,100% { filter: drop-shadow(0 2px 6px rgba(0,0,0,0.9)); }
            50%      { filter: drop-shadow(0 0 10px rgba(180,80,255,0.9)) drop-shadow(0 2px 6px rgba(0,0,0,0.9)); }
        }

        /* ── Toast notification ──────────────────────────────────── */
        #toast {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(20,10,40,0.92); border: 1px solid #6633aa;
            border-radius: 8px; padding: 8px 16px;
            font-size: 0.78rem; color: #eee; white-space: nowrap;
            z-index: 9999; pointer-events: none;
            opacity: 0; transition: opacity 0.3s;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>
    <!-- Status bar -->
    <div id="status-bar">
        <div class="portrait-wrap">
            <img src="../../assets/design/arisa-3d-art.png" alt="アリサ">
        </div>
        <div class="stats">
            <div class="stat-row">
                <span class="stat-lbl">HP</span>
                <div class="bar-bg"><div class="bar-fill bar-hp" id="hp-bar" style="width:100%"></div></div>
                <span class="stat-val" id="hp-val">128/128</span>
            </div>
            <div class="stat-row">
                <span class="stat-lbl">MP</span>
                <div class="bar-bg"><div class="bar-fill bar-mp" id="mp-bar" style="width:100%"></div></div>
                <span class="stat-val" id="mp-val">54/54</span>
            </div>
        </div>
        <div class="lv-badge" id="lv-badge">Lv.1</div>
        <div class="back-link"><a href="../../">← Back</a></div>
    </div>

    <!-- Main area -->
    <div id="main">
        <div id="toast"></div>

        <!-- OpenStreetMap -->
        <div id="map-layer">
            <div id="map" style="width:100%;height:100%"></div>
            <div id="map-dark-overlay"></div>
            <!-- 電子空間オーバーレイ（GPS確定前） -->
            <div id="cyber-overlay">
                <canvas id="cyber-canvas"></canvas>
                <div id="cyber-status">
                    <div id="cyber-icon">⬡</div>
                    <div id="cyber-text">電子空間に接続中...</div>
                    <div id="cyber-sub">GPS SIGNAL SCANNING</div>
                </div>
            </div>
            <button id="btn-recenter" title="現在地に戻る">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="5.5"/>
                    <line x1="12" y1="2" x2="12" y2="6.5"/>
                    <line x1="12" y1="17.5" x2="12" y2="22"/>
                    <line x1="2" y1="12" x2="6.5" y2="12"/>
                    <line x1="17.5" y1="12" x2="22" y2="12"/>
                    <circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/>
                </svg>
            </button>
            <div id="loc-overlay">
                <h2>🐱 アリサクエスト</h2>
                <p>現在地の周辺に敵が出現します<br>敵マーカーをタップして戦闘開始！</p>
                <button id="btn-gps">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="vertical-align:middle;margin-right:6px">
                        <circle cx="12" cy="12" r="5.5"/>
                        <line x1="12" y1="2" x2="12" y2="6.5"/>
                        <line x1="12" y1="17.5" x2="12" y2="22"/>
                        <line x1="2" y1="12" x2="6.5" y2="12"/>
                        <line x1="17.5" y1="12" x2="22" y2="12"/>
                        <circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/>
                    </svg>現在地を取得する</button>
                <p style="font-size:0.7rem;color:#665577">位置情報の許可が必要です</p>
            </div>
        </div>

        <!-- Battle overlay (shown when WASM is in battle state) -->
        <div id="battle-overlay">
            <button id="btn-debug">DBG</button>
            <button id="btn-hud">HUD</button>
            <div id="debug-overlay"></div>
            <!-- バトルHUD情報オーバーレイ -->
            <div id="battle-hud">
                <div class="hud-row">
                    <div class="hud-item">
                        <span class="hud-label">敵との距離</span>
                        <span class="hud-val" id="hud-dist">---</span>
                    </div>
                    <div class="hud-item">
                        <span class="hud-label">敵HP</span>
                        <span class="hud-val" id="hud-ehp">---</span>
                    </div>
                    <div class="hud-item">
                        <span class="hud-label">アリサHP</span>
                        <span class="hud-val" id="hud-php">---</span>
                    </div>
                </div>
            </div>
            <div id="canvas-area">
                <div id="canvas-scene">
                    <div id="game-wrapper">
                        <canvas id="bg-canvas"></canvas>
                        <canvas id="pyxel_canvas"></canvas>
                    </div>
                </div>
            </div>

            <!-- バトル結果画面 -->
            <div id="battle-result">
                <div id="battle-result-title">勝利！</div>
                <div id="battle-result-msg"></div>
                <button id="btn-back-to-map">🗺 マップに戻る</button>
            </div>

            <!-- Arisa Quest バトルUI（十字キーの代替） -->
            <div id="battle-ui">
                <div id="battle-commands">
                    <button class="battle-cmd" id="cmd-attack">⚔ たたかう</button>
                    <button class="battle-cmd" id="cmd-skill">✨ スキル</button>
                    <button class="battle-cmd" id="cmd-item">🎒 どうぐ</button>
                    <button class="battle-cmd" id="cmd-run">💨 にげる</button>
                </div>
            </div>
        </div>

        <!-- タブバー（常時表示） -->
        <div id="tab-bar">
            <button class="tab-btn active" id="tab-map">🗺 マップ</button>
            <button class="tab-btn" id="tab-battle">⚔ バトル</button>
            <button class="tab-btn" id="tab-status">📋 ステータス</button>
        </div>

    </div><!-- #main -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ── Gamepad input ─────────────────────────────────────────────────────
        const activeKeys = new Map();
        function pressKey(idx, down) { if (window.wasmModule) window.wasmModule.set_key(idx, down); }
        function onTouchStart(e) {
            e.preventDefault();
            for (const t of e.changedTouches) {
                const el = e.currentTarget, idx = parseInt(el.dataset.idx);
                if (!activeKeys.has(t.identifier)) {
                    activeKeys.set(t.identifier, { idx, el });
                    el.classList.add('active'); pressKey(idx, true);
                }
            }
        }
        function onTouchEnd(e) {
            e.preventDefault();
            for (const t of e.changedTouches) {
                const info = activeKeys.get(t.identifier);
                if (info) { info.el.classList.remove('active'); pressKey(info.idx, false); activeKeys.delete(t.identifier); }
            }
        }
        document.querySelectorAll('[data-idx]').forEach(btn => {
            btn.addEventListener('touchstart',  onTouchStart, { passive: false });
            btn.addEventListener('touchend',    onTouchEnd,   { passive: false });
            btn.addEventListener('touchcancel', onTouchEnd,   { passive: false });
        });
        window.pyxelPlaySound = () => {};
        window.pyxelStopSound = () => {};
    </script>

    <!-- ── Background canvas art layer ───────────────────────────────────── -->
    <script>
        const ASSET_BASE = '../../assets/design/';
        const BG_COLS = 6, BG_CW = 256, BG_CH = 256;
        const ARISA_DEST = { x: 4, y: 4,   w: 120, h: 160 };
        const ENE_DEST   = { x: 176, y: 8, w: 140, h: 152 };

        const ENEMY_MAP = [
            { sheet: 'enemy-sprites', sx: 256, sy: 256, sw: 256, sh: 128 }, // 0: スライム
            { sheet: 'enemy-sprites', sx: 256, sy:  32, sw: 256, sh: 96  }, // 1: シャドウキャット (skip label)
            { sheet: 'enemy-sprites', sx: 256, sy: 384, sw: 256, sh: 128 }, // 2: フレイムインプ
            { sheet: 'enemy-sprites', sx: 256, sy: 768, sw: 256, sh: 128 }, // 3: ゴースト
            { sheet: 'enemy-sprites', sx: 256, sy: 896, sw: 256, sh: 128 }, // 4: ロックゴーレム
        ];
        const ENEMY_NAMES = ['スライム','シャドウキャット','フレイムインプ','ゴースト','ロックゴーレム'];

        const SHEETS = {};
        const SHEET_LIST = ['enemy-sprites', 'arisa-player-sprites', 'arisa-world-backgrounds-2', 'arisa-3d-art'];
        let loadedCount = 0;
        for (const name of SHEET_LIST) {
            const img = new Image();
            img.onload = () => loadedCount++;
            img.onerror = () => { console.warn('sheet load failed:', name); loadedCount++; };
            img.src = ASSET_BASE + name + '.png';
            SHEETS[name] = img;
        }

        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx    = bgCanvas.getContext('2d');

        // 背景スワイプパン
        const BG_ZOOM     = 1.6;
        const BG_Y_ANCHOR = 0.15;
        let bgXOffset  = 0;   // スプライト空間のX方向オフセット（px）
        let bgPanVelX  = 0;   // 慣性速度
        let bgPanLastX = 0;
        let bgPanActive = false;

        function bgPanClamp() {
            const cropW = BG_CW / BG_ZOOM;
            const maxOff = (BG_CW - cropW) / 2;
            bgXOffset = Math.max(-maxOff, Math.min(maxOff, bgXOffset));
        }

        // タッチイベント（canvas-area全体で受け取る）
        const canvasArea = document.getElementById('canvas-area');
        canvasArea.addEventListener('touchstart', e => {
            if (e.touches.length !== 1) return;
            bgPanActive = true;
            bgPanLastX  = e.touches[0].clientX;
            bgPanVelX   = 0;
        }, { passive: true });
        canvasArea.addEventListener('touchmove', e => {
            if (!bgPanActive || e.touches.length !== 1) return;
            const dx = e.touches[0].clientX - bgPanLastX;
            bgPanLastX = e.touches[0].clientX;
            // CSS px → スプライト px 変換（ドラッグ方向と逆に背景が動く）
            const cropW = BG_CW / BG_ZOOM;
            bgXOffset  -= dx * (cropW / canvasArea.offsetWidth);
            bgPanVelX   = -dx * (cropW / canvasArea.offsetWidth);
            bgPanClamp();
        }, { passive: true });
        canvasArea.addEventListener('touchend', () => { bgPanActive = false; }, { passive: true });
        canvasArea.addEventListener('touchcancel', () => { bgPanActive = false; bgPanVelX = 0; }, { passive: true });

        // 慣性ループ（フレームごとに速度を減衰）
        function bgInertiaStep() {
            if (!bgPanActive && Math.abs(bgPanVelX) > 0.05) {
                bgXOffset += bgPanVelX;
                bgPanVelX *= 0.88;
                bgPanClamp();
            } else if (!bgPanActive) {
                bgPanVelX = 0;
            }
            requestAnimationFrame(bgInertiaStep);
        }
        bgInertiaStep();

        function resizeBgCanvas() {
            const canvasArea = document.getElementById('canvas-area');
            const dpr = window.devicePixelRatio || 1;
            const w = Math.round(canvasArea.offsetWidth  * dpr);
            const h = Math.round(canvasArea.offsetHeight * dpr);
            if (w > 0 && h > 0) {
                if (bgCanvas.width !== w || bgCanvas.height !== h) {
                    bgCanvas.width  = w;
                    bgCanvas.height = h;
                    bgCanvas.style.width  = canvasArea.offsetWidth  + 'px';
                    bgCanvas.style.height = canvasArea.offsetHeight + 'px';
                }
            }
        }
        window.addEventListener('resize', resizeBgCanvas);

        function beginScaledDraw() {
            resizeBgCanvas();
            bgCtx.save();
            bgCtx.imageSmoothingEnabled = true;
            bgCtx.imageSmoothingQuality = 'high';
            const scaleX = bgCanvas.width / 320;
            const scaleY = bgCanvas.height / 168;
            const s = Math.min(scaleX, scaleY);
            const xOff = (bgCanvas.width  - 320 * s) / 2;
            const yOff = (bgCanvas.height - 168 * s) / 2;
            bgCtx.translate(xOff, yOff);
            bgCtx.scale(s, s);
        }

        function renderBg() {
            if (!window.wasmModule) return;
            const state = window.wasmModule.get_game_state?.() ?? 0;
            if (state !== 2) {
                bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                return;
            }
            if (loadedCount < SHEET_LIST.length) return;

            const enemyIdx    = window.wasmModule.get_enemy_idx?.()    ?? -1;
            const bgIdx       = window.wasmModule.get_bg_idx?.()       ??  0;
            const enemyFlash  = window.wasmModule.get_enemy_flash?.()  ??  0;
            const playerFlash = window.wasmModule.get_player_flash?.() ??  0;

            // ライブデバッグ更新
            const dbgEl = document.getElementById('debug-overlay');
            if (dbgEl.classList.contains('visible')) {
                const hp    = window.wasmModule.get_player_hp?.()     ?? '?';
                const maxHp = window.wasmModule.get_player_max_hp?.() ?? '?';
                const mp    = window.wasmModule.get_player_mp?.()     ?? '?';
                const maxMp = window.wasmModule.get_player_max_mp?.() ?? '?';
                const lv    = window.wasmModule.get_player_level?.()  ?? '?';
                const bgI2  = ((bgIdx % 24) + 24) % 24;
                const bgZoom    = BG_ZOOM;
                const bgYAnchor = BG_Y_ANCHOR;
                const cropW2   = Math.round(BG_CW / bgZoom);
                const cropH2   = Math.round(BG_CH / bgZoom);
                const baseSrcX = (bgI2 % BG_COLS) * BG_CW;
                const baseSrcY = Math.floor(bgI2 / BG_COLS) * BG_CH;
                const cropX    = baseSrcX + Math.round((BG_CW - cropW2) / 2);
                const cropY    = baseSrcY + Math.round((BG_CH - cropH2) * bgYAnchor);
                const dpr      = window.devicePixelRatio || 1;
                dbgEl.textContent = [
                    `── ゲーム状態 ──`,
                    `state=${state}  Lv=${lv}`,
                    `HP=${hp}/${maxHp}  MP=${mp}/${maxMp}`,
                    `bgIdx=${bgIdx}  bgI=${bgI2}`,
                    ``,
                    `── 背景情報 ──`,
                    `シート位置: 列${bgI2 % BG_COLS} 行${Math.floor(bgI2/BG_COLS)}`,
                    `セル原点: (${baseSrcX}, ${baseSrcY})  ${BG_CW}×${BG_CH}px`,
                    `ZOOM: ×${bgZoom}`,
                    `XOffset: ${bgXOffset.toFixed(1)}px (vel:${bgPanVelX.toFixed(2)})`,
                    `クロップ領域: x=${cropX} y=${cropY}`,
                    `クロップサイズ: ${cropW2}×${cropH2}px`,
                    ``,
                    `── キャンバス ──`,
                    `CSS: ${bgCanvas.style.width} × ${bgCanvas.style.height}`,
                    `バッファ: ${bgCanvas.width}×${bgCanvas.height}px`,
                    `DPR: ${dpr}`,
                    ``,
                    `── 敵スプライト ──`,
                    dbgStaticText,
                    ``,
                    `── アリサスプライト ──`,
                    dbgArisaText,
                ].join('\n');
            }

            resizeBgCanvas();

            // Draw background to fill entire canvas (before scaled transform)
            // BG_ZOOM/BG_Y_ANCHOR はスクリプト上部で定義
            const bgI  = ((bgIdx % 24) + 24) % 24;
            const bgBaseX = (bgI % BG_COLS) * BG_CW;
            const bgBaseY = Math.floor(bgI / BG_COLS) * BG_CH;
            const cropW = BG_CW / BG_ZOOM;
            const cropH = BG_CH / BG_ZOOM;
            bgCtx.drawImage(
                SHEETS['arisa-world-backgrounds-2'],
                bgBaseX + (BG_CW - cropW) / 2 + bgXOffset,
                bgBaseY + (BG_CH - cropH) * BG_Y_ANCHOR,
                cropW, cropH,
                0, 0, bgCanvas.width, bgCanvas.height
            );

            // Draw characters in scaled 320×168 virtual space
            beginScaledDraw();

            // Arisa (left, idle pose: top-left 128×106 of first cell, skip 22px label)
            if (playerFlash <= 0 || Math.floor(playerFlash / 4) % 2 === 0) {
                bgCtx.drawImage(SHEETS['arisa-player-sprites'],
                    0, 22, 128, 106,
                    ARISA_DEST.x, ARISA_DEST.y, ARISA_DEST.w, ARISA_DEST.h);
            }

            // Enemy (right, slightly higher)
            if (enemyIdx >= 0 && enemyIdx < ENEMY_MAP.length) {
                const e = ENEMY_MAP[enemyIdx];
                if (enemyFlash <= 0 || Math.floor(enemyFlash / 4) % 2 === 0) {
                    bgCtx.drawImage(SHEETS[e.sheet], e.sx, e.sy, e.sw, e.sh,
                        ENE_DEST.x, ENE_DEST.y, ENE_DEST.w, ENE_DEST.h);
                }
            }
            bgCtx.globalAlpha = 1.0;
            bgCtx.restore();
        }

        function bgLoop() { renderBg(); requestAnimationFrame(bgLoop); }
        requestAnimationFrame(bgLoop);
    </script>

    <!-- ── Leaflet map + WASM integration ────────────────────────────────── -->
    <script>

        let toastTimer = null;
        function showToast(msg, duration = 6000) {
            const el = document.getElementById('toast');
            el.textContent = msg; el.classList.add('show');
            clearTimeout(toastTimer);
            console.log('[toast] showing:', msg, 'duration:', duration);
            toastTimer = setTimeout(() => {
                console.log('[toast] hiding after', duration, 'ms');
                el.classList.remove('show');
            }, duration);
        }

        const mapEl = document.getElementById('map');
        // size map to fill #main
        const mainEl = document.getElementById('main');
        mapEl.style.height = mainEl.clientHeight + 'px';
        window.addEventListener('resize', () => { mapEl.style.height = mainEl.clientHeight + 'px'; map.invalidateSize(); });

        const map = L.map('map', { zoomControl: true }).setView([35.6895, 139.6917], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
            maxZoom: 19,
        }).addTo(map);

        let playerMarker = null, arisaMarker = null, arisaPos = null;
        let enemyMarkers = [];

        function playerIcon() {
            return L.divIcon({
                html: `<div class="player-dot"></div>`,
                iconSize: [18, 18], iconAnchor: [9, 9], className: '',
            });
        }

        function arisaIcon(hint = false) {
            return L.divIcon({
                html: `<div class="arisa-marker${hint ? ' searchable' : ''}">
                    <img class="arisa-icon" src="${ASSET_BASE}arisa-3d-art.png">
                    <div class="arisa-lbl${hint ? ' tap-hint' : ''}">
                        ${hint ? '🔍 タップ' : 'アリサ'}
                    </div>
                </div>`,
                iconSize: [62, 80], iconAnchor: [31, 78], className: '',
            });
        }

        function makeEnemyIcon(idx) {
            const e = ENEMY_MAP[idx];
            const dispH = 52;
            const scaleF = dispH / e.sh;
            const dispW = Math.round(e.sw * scaleF);
            const bgW = Math.round(1536 * scaleF);
            const bgH = Math.round(1024 * scaleF);
            const bgX = -Math.round(e.sx * scaleF) - Math.round((dispW - 52) / 2);
            const bgY = -Math.round(e.sy * scaleF) - 30;
            const spriteStyle = [
                `width:52px;height:52px;border-radius:50%;overflow:hidden`,
                `background-image:url('${ASSET_BASE}${e.sheet}.png')`,
                `background-size:${bgW}px ${bgH}px`,
                `background-position:${bgX}px ${bgY}px`,
                `image-rendering:pixelated`,
                `border:2px solid #aa44ff`,
                `box-shadow:0 0 10px rgba(180,80,255,0.7)`,
            ].join(';');
            return L.divIcon({
                html: `<div class="enemy-marker">
                    <div class="enemy-pulse" style="${spriteStyle}"></div>
                    <div class="enemy-lbl">${ENEMY_NAMES[idx]}</div>
                </div>`,
                iconSize: [52, 68], iconAnchor: [26, 68], className: '',
            });
        }

        function spawnEnemies(lat, lng) {
            enemyMarkers.forEach(m => m.marker.remove());
            enemyMarkers = [];
            addEnemies(lat, lng, MAX_ENEMIES);
        }

        // 不足分だけ追加スポーン（既存の敵はそのまま）
        function addEnemies(lat, lng, count) {
            const indices = [];
            for (let i = 0; i < count; i++) {
                indices.push(Math.floor(Math.random() * ENEMY_NAMES.length));
            }
            indices.forEach((eIdx, i) => {
                const angle = Math.random() * Math.PI * 2;
                const dist  = 0.0005 + Math.random() * 0.002;
                const eLat  = lat + Math.cos(angle) * dist;
                const eLng  = lng + Math.sin(angle) * dist;
                setTimeout(() => {
                    const icon   = makeEnemyIcon(eIdx);
                    const marker = L.marker([eLat, eLng], { icon }).addTo(map);
                    const info   = { marker, eIdx, lat: eLat, lng: eLng };
                    marker.on('click', () => triggerBattle(info));
                    enemyMarkers.push(info);
                }, i * 300);
            });
        }

        // ── GPS ───────────────────────────────────────────────────────────────
        let mapFollowArisa = true; // GPS更新時に自動追従するか

        // 現在地に戻るボタン
        const btnRecenter = document.getElementById('btn-recenter');
        btnRecenter.addEventListener('click', () => {
            if (arisaPos) {
                map.setView(arisaPos, map.getZoom());
                mapFollowArisa = true;
                btnRecenter.style.display = 'none';
            }
        });
        // ユーザーが地図をドラッグしたら自動追従を止める
        map.on('dragstart', () => {
            mapFollowArisa = false;
            btnRecenter.style.display = 'flex';
        });

        function startGPS() {
            document.getElementById('loc-overlay').style.display = 'none';
            btnRecenter.style.display = 'none';

            // 電子空間を表示してマトリックスアニメーション開始
            const cyberOverlay = document.getElementById('cyber-overlay');
            const cyberCanvas  = document.getElementById('cyber-canvas');
            const cyberText    = document.getElementById('cyber-text');
            const cyberSub     = document.getElementById('cyber-sub');
            const cyberIcon    = document.getElementById('cyber-icon');
            cyberOverlay.classList.add('active');

            // マトリックス雨アニメーション
            const cctx = cyberCanvas.getContext('2d');
            function resizeCyberCanvas() {
                cyberCanvas.width  = cyberOverlay.offsetWidth;
                cyberCanvas.height = cyberOverlay.offsetHeight;
            }
            resizeCyberCanvas();
            const KANA = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            const CHARS = (KANA + '0123456789ABCDEF@#$%').split('');
            const COL_W = 18;
            let drops = [];
            function resetDrops() {
                const cols = Math.floor(cyberCanvas.width / COL_W);
                drops = Array.from({ length: cols }, () => Math.random() * -50);
            }
            resetDrops();
            let cyberRunning = true;
            function drawCyber() {
                if (!cyberRunning) return;
                cctx.fillStyle = 'rgba(0,8,20,0.18)';
                cctx.fillRect(0, 0, cyberCanvas.width, cyberCanvas.height);
                drops.forEach((y, i) => {
                    const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
                    // 先頭は明るく
                    cctx.fillStyle = `rgba(180,255,240,${0.5 + Math.random() * 0.5})`;
                    cctx.font = `bold ${COL_W - 2}px monospace`;
                    cctx.fillText(ch, i * COL_W, y * COL_W);
                    // トレイルは暗いシアン
                    cctx.fillStyle = `rgba(0,200,140,${0.15 + Math.random() * 0.2})`;
                    cctx.font = `${COL_W - 4}px monospace`;
                    const trail = CHARS[Math.floor(Math.random() * CHARS.length)];
                    cctx.fillText(trail, i * COL_W, (y - 2) * COL_W);
                    if (y * COL_W > cyberCanvas.height && Math.random() > 0.97) drops[i] = 0;
                    else drops[i] += 0.6;
                });
                requestAnimationFrame(drawCyber);
            }
            drawCyber();

            // GPS確定後に地図を表示する関数
            let gpsResolved = false;
            function revealMap(lat, lng, toastMsg) {
                if (gpsResolved) return;
                gpsResolved = true;
                cyberRunning = false;

                // ステータステキスト更新
                cyberIcon.textContent = '📍';
                cyberText.textContent = '座標確定！';
                cyberSub.textContent  = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;

                setTimeout(() => {
                    // フェードアウト開始
                    cyberOverlay.classList.add('fade-out');
                    // マーカー配置・地図移動
                    const defLat = 35.6895, defLng = 139.6917;
                    arisaPos = [lat, lng];
                    map.setView([lat, lng], 17);
                    playerMarker = L.marker([lat, lng], { icon: playerIcon(), zIndexOffset: 900 }).addTo(map);
                    arisaMarker  = L.marker([lat + 0.00005, lng], { icon: arisaIcon(true), zIndexOffset: 1000 }).addTo(map);
                    arisaMarker.on('click', onArisaTap);
                    mapFollowArisa = true;
                    showToast(toastMsg);
                    // フェードアウト完了後に非表示
                    setTimeout(() => {
                        cyberOverlay.classList.remove('active');
                        cyberOverlay.classList.remove('fade-out');
                    }, 1500);
                }, 1200);
            }

            // GPS タイムアウト（12秒）→ 東京フォールバック
            const fallbackTimer = setTimeout(() => {
                cyberText.textContent = '東京にワープ中...';
                cyberSub.textContent  = 'GPS TIMEOUT — WARP TO TOKYO';
                cyberIcon.textContent = '⚡';
                setTimeout(() => revealMap(35.6895, 139.6917, '⚡ 東京にワープしました'), 800);
            }, 12000);

            // GPS取得
            const opts = { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 };
            const LAT_OFFSET =  0.000;
            const LNG_OFFSET = -0.110;
            let firstFix = true;
            const onPos = pos => {
                const lat = pos.coords.latitude  + LAT_OFFSET;
                const lng = pos.coords.longitude + LNG_OFFSET;
                if (firstFix) {
                    firstFix = false;
                    clearTimeout(fallbackTimer);
                    revealMap(lat, lng, '📍 現在地を特定しました！');
                } else if (!gpsResolved) {
                    // まだ確定前なら更新
                    revealMap(lat, lng, '📍 現在地を特定しました！');
                } else {
                    // 確定済み → マーカー位置のみ更新
                    arisaPos = [lat, lng];
                    if (mapFollowArisa) map.setView([lat, lng], map.getZoom());
                    playerMarker?.setLatLng([lat, lng]);
                    arisaMarker?.setLatLng([lat + 0.00005, lng]);
                }
            };
            navigator.geolocation.getCurrentPosition(onPos, () => {}, opts);
            navigator.geolocation.watchPosition(onPos, () => {}, opts);

            // テキストをアニメーション
            const textPhases = ['電子空間に接続中...', 'GPS信号を探索中...', '衛星を探索中...', 'GPS信号を探索中...'];
            let tpi = 0;
            const textTimer = setInterval(() => {
                if (gpsResolved) { clearInterval(textTimer); return; }
                tpi = (tpi + 1) % textPhases.length;
                cyberText.textContent = textPhases[tpi];
            }, 2200);
        }
        document.getElementById('btn-gps').addEventListener('click', startGPS);

        // ── アリサタップ → サーチ演出 → 敵スポーン ───────────────────────────
        const MAX_ENEMIES = 5; // フィールドの最大敵数
        let isSearching = false;
        let searchRipple = null;

        function onArisaTap() {
            if (isSearching || inBattle) return;
            if (!arisaPos) return;
            const needed = MAX_ENEMIES - enemyMarkers.length;
            if (needed <= 0) return; // 満員なら何もしない
            isSearching = true;

            const isReplenish = enemyMarkers.length > 0;
            showToast(isReplenish ? '🔍 追加サーチ中…' : '🔍 エリアをサーチ中…');

            const [lat, lng] = arisaPos;
            searchRipple = L.circle([lat, lng], {
                radius: 10, color: '#ff88cc', fillColor: '#ff88cc',
                fillOpacity: 0.15, weight: 2, opacity: 0.8,
            }).addTo(map);

            let r = 10, maxR = 280;
            const expand = setInterval(() => {
                r += 18;
                searchRipple.setRadius(r);
                if (r >= maxR) {
                    clearInterval(expand);
                    searchRipple.remove();
                    searchRipple = null;

                    const trySpawn = () => {
                        if (loadedCount >= SHEET_LIST.length) {
                            addEnemies(lat, lng, needed);
                            showToast(isReplenish
                                ? `⚠️ 敵が ${needed}体 補充された！`
                                : '⚠️ 敵が出現した！');
                            // まだ満員でなければヒントを維持
                            if (arisaMarker) {
                                arisaMarker.setIcon(arisaIcon(enemyMarkers.length < MAX_ENEMIES));
                            }
                            isSearching = false;
                        } else {
                            setTimeout(trySpawn, 200);
                        }
                    };
                    trySpawn();
                }
            }, 40);
        }


        const battleOverlay = document.getElementById('battle-overlay');
        const battleUI      = document.getElementById('battle-ui');
        let inBattle = false, watchInterval = null;

        // ── デバッグ静的テキスト ──────────────────────────────────────────────
        let dbgStaticText = '(戦闘前)';
        let dbgArisaText  = 'sx=0 sy=22 sw=128 sh=106';

        // デバッグトグルボタン
        const btnDebug = document.getElementById('btn-debug');
        const dbgOverlay = document.getElementById('debug-overlay');
        btnDebug.addEventListener('click', () => {
            const on = dbgOverlay.classList.toggle('visible');
            btnDebug.classList.toggle('on', on);
        });

        // ── HUDトグル ────────────────────────────────────────────────────────
        let hudVisible = false;
        const btnHud   = document.getElementById('btn-hud');
        const battleHud = document.getElementById('battle-hud');
        btnHud.addEventListener('click', () => {
            hudVisible = !hudVisible;
            btnHud.classList.toggle('on', hudVisible);
            battleHud.classList.toggle('active', hudVisible);
        });

        // HUD更新（バトル中の敵との距離・HP情報）
        let currentEnemyInfo = null; // triggerBattleでセット
        function updateBattleHud() {
            if (!hudVisible || !window.wasmModule) return;
            const hp    = window.wasmModule.get_player_hp?.()     ?? 0;
            const maxHp = window.wasmModule.get_player_max_hp?.() ?? 1;
            const phpEl = document.getElementById('hud-php');
            phpEl.textContent = `${hp}/${maxHp}`;
            phpEl.className = 'hud-val';

            // 敵との距離（戦闘開始地点のGPS座標から計算）
            const distEl = document.getElementById('hud-dist');
            if (currentEnemyInfo && arisaPos) {
                const [aLat, aLng] = arisaPos;
                const dLat = (currentEnemyInfo.lat - aLat) * 111320;
                const dLng = (currentEnemyInfo.lng - aLng) * 111320 * Math.cos(aLat * Math.PI / 180);
                const dist = Math.round(Math.sqrt(dLat * dLat + dLng * dLng));
                distEl.textContent = dist < 1000 ? `${dist}m` : `${(dist/1000).toFixed(1)}km`;
                distEl.className = 'hud-val ' + (dist < 80 ? 'near' : dist < 200 ? 'mid' : 'far');
            } else {
                distEl.textContent = '---';
                distEl.className = 'hud-val';
            }
            // 敵HPはWASMから直接取れないため表示なし（将来拡張）
            document.getElementById('hud-ehp').textContent = '???';
        }
        setInterval(updateBattleHud, 500);

        // ── バトルコマンド キーシミュレーション ──────────────────────────────
        // IDX: 5=↑ 6=↓ 7=← 8=→ 45=決定 43=キャンセル
        function simulateKeys(steps) {
            steps.forEach(([idx, down], i) => {
                setTimeout(() => pressKey(idx, down), i * 70);
            });
        }
        // WASMバトルメニュー: たたかう(左上) スキル(右上) どうぐ(左下) にげる(右下)
        // 各コマンド選択後カーソルはたたかうに戻る前提
        const CMD_ATTACK = [[45,true],[45,false]];
        const CMD_SKILL  = [[8,true],[8,false],[45,true],[45,false]];
        const CMD_ITEM   = [[6,true],[6,false],[45,true],[45,false]];
        const CMD_RUN    = [[6,true],[6,false],[8,true],[8,false],[45,true],[45,false]];

        document.getElementById('cmd-attack').addEventListener('click', () => simulateKeys(CMD_ATTACK));
        document.getElementById('cmd-skill').addEventListener('click',  () => simulateKeys(CMD_SKILL));
        document.getElementById('cmd-item').addEventListener('click',   () => simulateKeys(CMD_ITEM));
        document.getElementById('cmd-run').addEventListener('click',    () => simulateKeys(CMD_RUN));

        // バトル結果画面「マップに戻る」ボタン
        document.getElementById('btn-back-to-map').addEventListener('click', () => {
            document.getElementById('battle-result').classList.remove('active');
            battleOverlay.classList.remove('active');
            setActiveTab('tab-map');
        });

        // タブ切り替え
        function setActiveTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }
        document.getElementById('tab-map').addEventListener('click', () => {
            setActiveTab('tab-map');
            battleOverlay.classList.remove('active');
            battleUI.classList.remove('active');
            document.getElementById('battle-result').classList.remove('active');
        });
        document.getElementById('tab-battle').addEventListener('click', () => {
            setActiveTab('tab-battle');
            if (inBattle) {
                battleOverlay.classList.add('active');
                battleUI.classList.add('active');
            }
        });
        document.getElementById('tab-status').addEventListener('click', () => {
            setActiveTab('tab-status');
            const on = dbgOverlay.classList.toggle('visible');
            btnDebug.classList.toggle('on', on);
        });

        function triggerBattle(enemyInfo) {
            if (inBattle || !window.wasmModule) return;
            inBattle = true;
            window.wasmModule.start_battle_from_js(enemyInfo.eIdx);
            battleOverlay.classList.add('active');
            battleUI.classList.add('active');
            setActiveTab('tab-battle');
            requestAnimationFrame(() => resizeBgCanvas());

            // 静的スプライト情報をセット
            const e = ENEMY_MAP[enemyInfo.eIdx];
            dbgStaticText = [
                `[${enemyInfo.eIdx}] ${ENEMY_NAMES[enemyInfo.eIdx]}`,
                `sx=${e.sx} sy=${e.sy} sw=${e.sw} sh=${e.sh}`,
                `dest x=${ENE_DEST.x} y=${ENE_DEST.y} w=${ENE_DEST.w} h=${ENE_DEST.h}`,
            ].join('\n');
            dbgArisaText = [
                `sx=0 sy=22 sw=128 sh=106`,
                `dest x=${ARISA_DEST.x} y=${ARISA_DEST.y} w=${ARISA_DEST.w} h=${ARISA_DEST.h}`,
            ].join('\n');

            // Poll for battle end (state leaves 2)
            watchInterval = setInterval(() => {
                const state = window.wasmModule.get_game_state?.() ?? 0;
                if (state !== 2) endBattle(enemyInfo);
            }, 300);
        }

        function endBattle(enemyInfo) {
            clearInterval(watchInterval);
            inBattle = false;
            battleUI.classList.remove('active');
            // マップに自動遷移せず、結果画面を表示する

            const state = window.wasmModule?.get_game_state?.() ?? 0;
            const resultEl    = document.getElementById('battle-result');
            const titleEl     = document.getElementById('battle-result-title');
            const msgEl       = document.getElementById('battle-result-msg');

            titleEl.className = '';
            if (state === 1) {
                titleEl.textContent = '勝利！';
                titleEl.classList.add('win');
                enemyInfo.marker.remove();
                const idx = enemyMarkers.indexOf(enemyInfo);
                if (idx >= 0) enemyMarkers.splice(idx, 1);
                const remaining = enemyMarkers.length;
                if (remaining === 0) {
                    msgEl.textContent = '全員倒した！\nアリサをタップしてサーチ';
                } else {
                    msgEl.textContent = `残り ${remaining}体\nアリサをタップして補充できます`;
                }
                // 敵が減ったらアリサにサーチヒント表示
                if (arisaMarker) arisaMarker.setIcon(arisaIcon(true));
            } else if (state === 0) {
                // タイトルに戻った = ゲームオーバー
                titleEl.textContent = 'ゲームオーバー';
                titleEl.classList.add('lose');
                msgEl.textContent = 'アリサは倒れてしまった…';
            } else {
                // 予期しない状態（早期終了など）
                titleEl.textContent = '逃走した';
                titleEl.classList.add('fled');
                msgEl.textContent = '';
            }
            resultEl.classList.add('active');
            updateStatusBar();
        }

        // ── Status bar update ────────────────────────────────────────────────
        function updateStatusBar() {
            if (!window.wasmModule) return;
            const hp    = window.wasmModule.get_player_hp?.()     ?? 128;
            const maxHp = window.wasmModule.get_player_max_hp?.() ?? 128;
            const mp    = window.wasmModule.get_player_mp?.()     ?? 54;
            const maxMp = window.wasmModule.get_player_max_mp?.() ?? 54;
            const lv    = window.wasmModule.get_player_level?.()  ?? 1;
            document.getElementById('hp-bar').style.width = (hp / maxHp * 100) + '%';
            document.getElementById('hp-val').textContent = hp + '/' + maxHp;
            document.getElementById('mp-bar').style.width = (mp / maxMp * 100) + '%';
            document.getElementById('mp-val').textContent = mp + '/' + maxMp;
            document.getElementById('lv-badge').textContent = 'Lv.' + lv;
        }
        setInterval(updateStatusBar, 500);
    </script>

    <!-- ── WASM init ──────────────────────────────────────────────────────── -->
    <script type="module">
        import init, {
            set_key,
            get_game_state, get_enemy_idx, get_bg_idx,
            get_enemy_flash, get_player_flash,
            get_player_hp, get_player_max_hp,
            get_player_mp, get_player_max_mp, get_player_level,
            start_battle_from_js,
        } from './pkg/rpg_rust_lib.js';
        try {
            await init();
            window.wasmModule = {
                set_key,
                get_game_state, get_enemy_idx, get_bg_idx,
                get_enemy_flash, get_player_flash,
                get_player_hp, get_player_max_hp,
                get_player_mp, get_player_max_mp, get_player_level,
                start_battle_from_js,
            };
        } catch(e) {
            console.error('WASM init failed:', e);
        }
    </script>
</body>
</html>
