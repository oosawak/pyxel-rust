<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 WASM Video Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f; color: #eee; font-family: monospace;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100svh; gap: 12px; padding: 16px;
  }
  h1 { font-size: 1rem; color: #88aaff; letter-spacing: 2px; margin-top: 8px; }
  #video-list {
    width: 100%; max-width: 640px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .video-item {
    background: #111827; border: 1px solid #334; border-radius: 6px;
    padding: 10px 14px; cursor: pointer; transition: background 0.15s;
    display: flex; justify-content: space-between; align-items: center;
  }
  .video-item:hover { background: #1a2540; }
  .video-item .title { color: #aac4ff; font-size: 0.9rem; }
  .video-item .meta  { color: #557; font-size: 0.7rem; }
  #player-wrap {
    width: 100%; max-width: 640px;
    background: #111; border-radius: 8px; overflow: hidden;
    border: 1px solid #334; display: none;
    position: relative;
  }
  video { display: block; width: 100%; height: auto; }
  #unmute-btn {
    position: absolute; bottom: 12px; right: 12px;
    background: rgba(0,0,0,0.75); border: 1px solid #88aaff;
    color: #aac4ff; font-size: 1.4rem; border-radius: 50%;
    width: 48px; height: 48px; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    z-index: 10;
  }
  #unmute-btn:hover { background: rgba(30,50,120,0.9); }
  #progress-bar-wrap {
    width: 100%; max-width: 640px;
    background: #111; border-radius: 4px; overflow: hidden;
    height: 4px; display: none;
  }
  #progress-bar { height: 100%; background: #4466ff; width: 0%; transition: width 0.3s; }
  #status { font-size: 0.75rem; color: #668; width: 100%; max-width: 640px; }
  #status.ok  { color: #4a8; }
  #status.err { color: #f66; }
  #no-videos { color: #446; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>🎬 WASM ENCRYPTED VIDEO PLAYER</h1>

<div id="video-list"><div id="no-videos">読み込み中...</div></div>

<button id="play-btn" style="display:none">▶ タップして再生</button>

<div id="progress-bar-wrap"><div id="progress-bar"></div></div>
<div id="player-wrap">
  <video id="video" controls muted playsinline></video>
  <button id="unmute-btn" title="音を出す">🔊</button>
</div>
<div id="status"></div>

<script type="module">
import init, { decrypt_chunk_at } from './pkg/video_player.js';

const videoList  = document.getElementById('video-list');
const playerWrap = document.getElementById('player-wrap');
const progressWrap = document.getElementById('progress-bar-wrap');
const progressBar  = document.getElementById('progress-bar');
const videoEl    = document.getElementById('video');
const statusEl   = document.getElementById('status');
const playBtn    = document.getElementById('play-btn');
const unmuteBtn  = document.getElementById('unmute-btn');

// 🔊 アンミュートボタン
unmuteBtn.addEventListener('click', () => {
  videoEl.muted = false;
  unmuteBtn.style.display = 'none';
});

function setStatus(msg, type = '') {
  statusEl.textContent = msg;
  statusEl.className = type;
}

// WASMを先に初期化
await init('./pkg/video_player_bg.wasm');

const API_BASE = '';  // 同オリジン（サーバー経由）

// ── 再生モード選択 ────────────────────────────────────────────────────────
// USE_WEBRTC=true  → WebRTC DataChannel経由でチャンク受信（DTLS暗号化）
// USE_WEBRTC=false → 既存HTTP API経由（fetch）
const USE_WEBRTC = true;

// URLパラメータに ?id= があれば消音で自動再生
const urlId = new URLSearchParams(location.search).get('id');
if (urlId) {
  videoList.style.display = 'none';
  USE_WEBRTC ? playVideoRTC(urlId) : playVideo(urlId);
} else {
  loadList();
}

// 動画一覧取得
async function loadList() {
  const res = await fetch('/api/videos');
  const videos = await res.json();
  if (videos.length === 0) {
    videoList.innerHTML = '<div id="no-videos">動画がありません — 管理画面からアップロードしてください</div>';
    return;
  }
  videoList.innerHTML = videos.map(v => `
    <div class="video-item" data-id="${v.id}">
      <div>
        <div class="title">🎬 ${v.title}</div>
        <div class="meta">${v.chunkCount}チャンク · ${new Date(v.createdAt).toLocaleString('ja-JP')}</div>
      </div>
      <div class="meta">▶</div>
    </div>`).join('');
  videoList.querySelectorAll('.video-item').forEach(el => {
    el.addEventListener('click', () =>
      USE_WEBRTC ? playVideoRTC(el.dataset.id) : playVideo(el.dataset.id));
  });
}

async function playVideo(id) {
  playerWrap.style.display = 'block';
  progressWrap.style.display = 'block';
  progressBar.style.width = '0%';
  videoEl.src = '';
  setStatus('📋 manifest取得中...');

  const manifest = await (await fetch(`/api/video/${id}/manifest`)).json();
  const key = hexToBytes(manifest.key);
  const iv  = hexToBytes(manifest.iv);

  // MediaSource でストリーミング再生
  const mime = 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"';
  if (!MediaSource.isTypeSupported(mime)) {
    // MSE非対応ブラウザ向け: 全チャンク結合してBlobで再生
    return playFallback(id, manifest, key, iv);
  }

  const ms = new MediaSource();
  videoEl.src = URL.createObjectURL(ms);

  ms.addEventListener('sourceopen', async () => {
    const sb = ms.addSourceBuffer(mime);
    let byteOffset = 0;

    for (let i = 0; i < manifest.chunks.length; i++) {
      setStatus(`🔓 チャンク復号中... [${i + 1}/${manifest.chunks.length}]`);
      progressBar.style.width = `${((i + 1) / manifest.chunks.length) * 100}%`;

      const encData = new Uint8Array(
        await (await fetch(`/api/video/${id}/chunk/${i}`)).arrayBuffer()
      );
      const decrypted = decrypt_chunk_at(encData, key, iv, BigInt(byteOffset));
      byteOffset += manifest.chunks[i].originalSize;

      // SourceBuffer に追記（更新完了を待つ）
      await new Promise((resolve, reject) => {
        sb.addEventListener('updateend', resolve, { once: true });
        sb.addEventListener('error', reject, { once: true });
        sb.appendBuffer(decrypted);
      });

      if (i === 0) videoEl.play();
    }
    ms.endOfStream();
    setStatus(`✅ 全チャンク復号完了`, 'ok');
  });
}

// MSE非対応フォールバック（全チャンク結合Blob）
async function playFallback(id, manifest, key, iv) {
  const parts = [];
  let byteOffset = 0;
  for (let i = 0; i < manifest.chunks.length; i++) {
    setStatus(`🔓 復号中... [${i + 1}/${manifest.chunks.length}]`);
    progressBar.style.width = `${((i + 1) / manifest.chunks.length) * 100}%`;
    const enc = new Uint8Array(await (await fetch(`/api/video/${id}/chunk/${i}`)).arrayBuffer());
    parts.push(decrypt_chunk_at(enc, key, iv, BigInt(byteOffset)));
    byteOffset += manifest.chunks[i].originalSize;
  }
  const blob = new Blob(parts.map(p => p.buffer), { type: 'video/mp4' });
  videoEl.muted = true;
  videoEl.src = URL.createObjectURL(blob);
  videoEl.play();
  setStatus('🔇 消音で自動再生中 — 右下の 🔊 ボタンで音を出せます', 'ok');
  unmuteBtn.style.display = 'flex';
}

function hexToBytes(hex) {
  const arr = new Uint8Array(hex.length / 2);
  for (let i = 0; i < arr.length; i++) arr[i] = parseInt(hex.slice(i*2, i*2+2), 16);
  return arr;
}

// ── WebRTC DataChannel 再生 ───────────────────────────────────────────────
// HTTP APIは使わず、DataChannel(DTLS暗号化)でチャンクを受信して復号・再生
// isFragmented=true の動画はMSEで逐次appendして早期再生開始
async function playVideoRTC(id) {
  playerWrap.style.display = 'block';
  progressWrap.style.display = 'block';
  progressBar.style.width = '0%';
  // 前回の blob URL を解放してビデオ要素をリセット
  if (videoEl.src && videoEl.src.startsWith('blob:')) URL.revokeObjectURL(videoEl.src);
  videoEl.src = '';
  videoEl.load();
  unmuteBtn.style.display = 'none';
  setStatus('📡 WebRTC接続中...');

  // MSEストリーミング用状態
  let ms = null, sb = null;
  const appendQueue = [];
  let appending = false;
  let playStarted = false;
  let receivedCount = 0;

  // MSE appendキュー処理（null=endOfStream信号）
  async function flushMSE() {
    if (appending || !sb) return;
    appending = true;
    while (appendQueue.length > 0) {
      const item = appendQueue.shift();
      if (item === null) { try { ms.endOfStream(); } catch(_){} break; }
      if (sb.updating) await new Promise(r => sb.addEventListener('updateend', r, {once:true}));
      sb.appendBuffer(item);
      await new Promise(r => sb.addEventListener('updateend', r, {once:true}));
      // init(chunk0) + 最初のメディアセグメント(chunk1) 受信後に再生開始
      if (!playStarted && receivedCount >= 2) {
        playStarted = true;
        videoEl.muted = true;
        videoEl.play().catch(() => {});
        setStatus('🔇 ストリーミング再生中 — 右下の 🔊 ボタンで音を出せます', 'ok');
        unmuteBtn.style.display = 'flex';
      }
    }
    appending = false;
  }

  try {
    const pc = new RTCPeerConnection({ iceServers: [] });
    const channel = pc.createDataChannel('video', { ordered: true });
    channel.binaryType = 'arraybuffer';

    let meta = null;
    const blobParts = [];
    let currentFragBufs = [];
    let currentChunkSize = 0;

    await new Promise(async (resolve, reject) => {
      let settled = false;
      const done = (fn) => { if (!settled) { settled = true; fn(); } };

      const timer = setTimeout(() => {
        done(() => reject(new Error('接続タイムアウト (15秒) — 再試行してください')));
      }, 15000);

      channel.onopen = () => {
        clearTimeout(timer);
        setStatus('📡 DataChannel接続完了 — 再生リクエスト送信...');
        channel.send(`play:${id}`);
      };

      pc.onconnectionstatechange = () => {
        const s = pc.connectionState;
        if (s === 'connecting') setStatus('📡 WebRTC接続中 (DTLS)...');
        if (s === 'connected') setStatus('📡 WebRTC接続確立');
        if (s === 'failed' || s === 'disconnected') {
          done(() => { clearTimeout(timer); reject(new Error(`接続失敗 (${s})`)); });
        }
      };
      pc.oniceconnectionstatechange = () => {
        const s = pc.iceConnectionState;
        setStatus(`�� WebRTC接続中 (ICE: ${s})...`);
        if (s === 'failed') {
          done(() => { clearTimeout(timer); reject(new Error('ICE接続失敗')); });
        }
      };

      channel.onmessage = async ({ data }) => {
        if (typeof data === 'string') {
          const msg = JSON.parse(data);
          if (msg.error) { done(() => reject(new Error(msg.error))); return; }

          if (msg.type === 'meta') {
            meta = msg;
            const label = meta.isFragmented ? '🎬 MSEストリーミング' : '📼 Blobモード';
            setStatus(`📋 メタ情報受信 (${msg.chunkCount}チャンク) ${label}`);
            if (meta.isFragmented && MediaSource.isTypeSupported(meta.mimeType)) {
              ms = new MediaSource();
              const msURL = URL.createObjectURL(ms);
              const sourceOpenP = new Promise(r => ms.addEventListener('sourceopen', r, {once:true}));
              videoEl.src = msURL;
              videoEl.load();
              await sourceOpenP;
              sb = ms.addSourceBuffer(meta.mimeType);
            }
          }
          if (msg.type === 'chunk-start') {
            currentFragBufs = [];
            currentChunkSize = msg.size;
          }
          if (msg.type === 'chunk-end') {
            const full = new Uint8Array(currentChunkSize);
            let off = 0;
            for (const frag of currentFragBufs) { full.set(frag, off); off += frag.length; }
            receivedCount++;
            progressBar.style.width = `${(receivedCount / (meta?.chunkCount || 1)) * 100}%`;
            if (!playStarted)
              setStatus(`📦 受信中 [${receivedCount}/${meta?.chunkCount}]`);

            // ★ 各チャンクは独立してCTR[0]で暗号化 → 常にoffset=0で復号
            const key = hexToBytes(meta.key);
            const iv  = hexToBytes(meta.iv);
            const dec = decrypt_chunk_at(full, key, iv, BigInt(0));

            if (ms && sb) {
              appendQueue.push(dec);
              flushMSE();
            } else {
              blobParts.push(dec);
            }
          }
          if (msg.type === 'done') {
            if (ms && sb) { appendQueue.push(null); flushMSE(); }
            done(resolve);
            return;
          }
          return;
        }
        currentFragBufs.push(new Uint8Array(data));
      };

      channel.onerror = e => { done(() => { clearTimeout(timer); reject(e); }); };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      await new Promise(r => {
        if (pc.iceGatheringState === 'complete') return r();
        pc.onicegatheringstatechange = () => {
          if (pc.iceGatheringState === 'complete') r();
        };
        setTimeout(r, 1500);
      });

      const sigRes = await fetch('/rtc/signal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ offer: pc.localDescription }),
      });
      const { answer } = await sigRes.json();
      await pc.setRemoteDescription(answer);
    });

    // Blobフォールバック（非フラグメント動画 or MSE非対応）
    if (!ms) {
      const blob = new Blob(blobParts, { type: meta?.mimeType || 'video/mp4' });
      videoEl.muted = true;
      videoEl.src = URL.createObjectURL(blob);
      await videoEl.play();
      setStatus('🔇 消音で自動再生中 — 右下の 🔊 ボタンで音を出せます', 'ok');
      unmuteBtn.style.display = 'flex';
    }

    pc.close();
  } catch (e) {
    setStatus(`❌ ${e.message}`, 'err');
    console.error('[rtc] playVideoRTC error:', e);
    playBtn.textContent = '🔄 再接続';
    playBtn.style.display = 'block';
    playBtn.onclick = () => { playBtn.style.display = 'none'; playVideoRTC(id); };
  }
}

loadList();
</script>
</body>
</html>
