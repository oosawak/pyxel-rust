[package]
name = "video-player"
version = "0.1.0"
edition = "2021"
description = "AES-256-CTR WASM video decryption player"

# 親ワークスペースから独立
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
aes = "0.8"
ctr = "0.9"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
getrandom = { version = "0.2", features = ["js"] }
cipher = "0.4"

[profile.release]
opt-level = "z"
lto = true
